<style>
  :root { --bg:#fcf9f5; --card:#ffffff; --ink:#1b1c1a; --muted:#747870; --line:#c4c8be; --primary:#52634c; --err:#ba1a1a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--ink); font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; word-break:keep-all; }
  main { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; text-align:center; }
  .icon { font-size:28px; }
  .tag { display:inline-block; margin:10px 0 6px; padding:3px 10px; border-radius:999px; background:#d5e8cb; color:#101f0d; font-size:11px; font-weight:700; }
  h1 { font-size:17px; line-height:1.45; margin:0 0 8px; }
  .desc { font-size:13px; line-height:1.6; color:var(--muted); margin:0 0 18px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:11px 12px; font-size:15px; border:1.5px solid var(--line); border-radius:10px; outline:none; }
  input:focus { border-color:var(--primary); }
  button { padding:11px 16px; font-size:14px; font-weight:700; color:#fff; background:var(--primary); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #msg { min-height:20px; font-size:12px; margin:10px 0 0; color:var(--muted); }
  #msg.err { color:var(--err); font-weight:600; }
  .back { display:inline-block; margin-top:14px; font-size:12px; color:var(--muted); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

<script>
(function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "hub_admin_pass";
  var form = document.getElementById("f"), input = document.getElementById("p");
  var btn = document.getElementById("b"), msg = document.getElementById("msg");

  function say(text, isErr) { msg.textContent = text; msg.className = isErr ? "err" : ""; }
  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  async function decrypt(pass) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct)));
  }

  async function unlock(pass, silent) {
    btn.disabled = true;
    say("여는 중…", false);
    var html;
    try { html = await decrypt(pass); }
    catch (e) {
      btn.disabled = false;
      say(silent ? "" : "암호가 맞지 않습니다.", !silent);
      try { if (silent) sessionStorage.removeItem(KEY); } catch (_) {}
      return;
    }
    try { sessionStorage.setItem(KEY, pass); sessionStorage.setItem("seung_hub_admin_auth", "granted"); } catch (_) {}
    document.open();
    document.write(html);
    document.close();
  }

  if (!window.crypto || !crypto.subtle) {
    say("이 브라우저에서는 열 수 없습니다. https 주소로 접속해 주세요.", true);
    btn.disabled = true;
    return;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); unlock(input.value, false); });
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (_) {}
  if (saved) unlock(saved, true); else input.focus();
})();
</script>
