          ]}
        ],
        notice: "학교와 협의 중인 교육과정안입니다. 일정과 세부 내용은 바뀔 수 있습니다."
      }
    ];

    const ACCENT = {
      primary:   { chip: "bg-primary-fixed text-on-primary-fixed", icon: "bg-primary-fixed/60 text-primary", bar: "bg-primary" },
      secondary: { chip: "bg-secondary-fixed text-secondary", icon: "bg-secondary-fixed/60 text-secondary", bar: "bg-secondary" }
    };

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderHome() {
      const cards = LECTURES.map(l => {
        const a = ACCENT[l.accent];
        return `
        <a href="#${l.id}" class="block bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-sm hover:border-primary/50 transition-all">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-lg ${a.icon} flex items-center justify-center shrink-0">
              <span class="material-symbols-outlined text-[22px]">${l.icon}</span>
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded ${a.chip}">${esc(l.badge)}</span>
                <span class="text-[11px] text-outline">${esc(l.status)}</span>
              </div>
              <h3 class="text-[15px] font-bold leading-snug mt-1.5">${esc(l.title)}</h3>
              <p class="text-xs text-on-surface-variant mt-1">${esc(l.facts[0].value)} · ${esc(l.facts[2].value)}</p>
            </div>
            <span class="material-symbols-outlined text-outline text-[20px] mt-2">chevron_right</span>
          </div>
        </a>`;
      }).join("");

      document.getElementById("view-home").innerHTML = `
        <div class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-sm">
          <p class="text-sm leading-relaxed text-on-surface">
            강의 안내와 수업에서 함께 보는 자료를 모았습니다.<br/>
            특강을 고르면 흐름과 참고 자료를 볼 수 있습니다.
          </p>
        </div>
        <div class="flex items-center justify-between pt-1">
          <h2 class="text-sm font-bold">공개 특강</h2>
          <span class="text-[11px] text-outline">${LECTURES.length}개</span>
        </div>
        <div class="space-y-3">${cards}</div>`;
    }

    function section(title, body) {
      return `
        <div class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant/50 shadow-sm space-y-3">
          <h3 class="text-sm font-bold text-primary">${esc(title)}</h3>
          ${body}
        </div>`;
    }

    function renderLecture(l) {
      const a = ACCENT[l.accent];
      let html = `
        <div class="space-y-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="text-[11px] font-bold px-2 py-0.5 rounded ${a.chip}">${esc(l.badge)}</span>
            <span class="text-[11px] text-outline">${esc(l.status)}</span>
          </div>
          <h2 class="text-xl font-bold leading-snug">${esc(l.title)}</h2>
          <p class="text-sm text-on-surface-variant leading-relaxed">${esc(l.lead)}</p>
        </div>

        <dl class="bg-surface-container-lowest rounded-xl border border-outline-variant/50 shadow-sm divide-y divide-outline-variant/30">
          ${l.facts.map(f => `
            <div class="flex gap-3 px-4 py-2.5 text-sm">
              <dt class="w-12 shrink-0 text-outline">${esc(f.label)}</dt>
              <dd class="flex-1">${esc(f.value)}</dd>
            </div>`).join("")}
        </dl>

        <div class="relative pl-4 py-1">
          <span class="absolute left-0 top-1 bottom-1 w-1 rounded-full ${a.bar}"></span>
          <div class="text-[11px] font-bold text-outline">${esc(l.keyLabel)}</div>
          <p class="text-[15px] font-semibold leading-relaxed mt-0.5">${esc(l.key)}</p>
        </div>`;

      html += section(l.listTitle, `
        <ol class="space-y-2">
          ${l.list.map((t, i) => `
            <li class="flex gap-2.5 text-sm leading-relaxed">
              <span class="w-5 h-5 shrink-0 rounded-full bg-surface-container text-[11px] font-bold flex items-center justify-center mt-0.5">${i + 1}</span>
              <span>${esc(t)}</span>
            </li>`).join("")}
        </ol>`);

      html += section(l.flowTitle, `
        <ol class="relative border-l-2 border-outline-variant/50 ml-1.5 space-y-3.5">
          ${l.flow.map(s => `
            <li class="pl-4 relative">
              <span class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full ${a.bar} ring-4 ring-surface-container-lowest"></span>
              <div class="flex items-baseline gap-2">
                <span class="text-[11px] font-bold text-outline shrink-0">${esc(s.time)}</span>
                <span class="text-sm font-bold">${esc(s.title)}</span>
              </div>
              <p class="text-[13px] text-on-surface-variant leading-relaxed mt-0.5">${esc(s.text)}</p>
              ${s.out ? `<p class="text-[12px] mt-1"><span class="text-outline">결과물</span> · ${esc(s.out)}</p>` : ""}
            </li>`).join("")}
        </ol>`);

      if (l.checks.length) {
        html += section(l.checkTitle, `
          <ul class="space-y-2">
            ${l.checks.map(c => `
              <li class="flex gap-3 text-sm leading-relaxed">
                <span class="w-10 shrink-0 font-bold">${esc(c.k)}</span>
                <span class="text-on-surface-variant">${esc(c.v)}</span>
              </li>`).join("")}
          </ul>
          ${l.closing ? `<p class="text-[13px] font-semibold pt-2 border-t border-outline-variant/30">“${esc(l.closing)}”</p>` : ""}`);
      }

      if (l.apps.length) {
        html += section("실습 앱", l.apps.map(ap => `
          <div class="p-3 rounded-lg bg-surface-container-low space-y-2">
            <div class="flex items-center gap-1.5">
              <span class="text-sm font-bold">${esc(ap.title)}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-surface-container-high text-on-surface-variant">${esc(ap.tag)}</span>
            </div>
            <p class="text-[13px] text-on-surface-variant leading-relaxed">${esc(ap.desc)}</p>
            <div class="flex items-center justify-between">
              <span class="text-[11px] text-outline">${esc(ap.note)}</span>
              <a href="${esc(ap.url)}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-primary text-white text-xs font-bold hover:bg-primary/90 flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">open_in_new</span> 열기
              </a>
            </div>
          </div>`).join(""));
      }

      html += section("참고 자료", l.refs.map(g => `
        <div class="space-y-1.5">
          <div class="text-[11px] font-bold text-outline pt-1">${esc(g.group)}</div>
          ${g.items.map(r => `
            <a href="${esc(r.url)}" target="_blank" rel="noopener" class="block p-3 rounded-lg hover:bg-surface-container-low border border-outline-variant/30 transition-all">
              <div class="flex items-start justify-between gap-2">
                <span class="text-[13px] font-semibold leading-snug">${esc(r.title)}</span>
                <span class="material-symbols-outlined text-[15px] text-outline shrink-0 mt-0.5">open_in_new</span>
              </div>
              <div class="text-[11px] text-outline mt-0.5">${esc(r.source)}</div>
              <p class="text-[12px] text-on-surface-variant leading-relaxed mt-1">${esc(r.line)}</p>
            </a>`).join("")}
        </div>`).join(""));

      html += `
        <p class="flex gap-1.5 text-[12px] text-outline leading-relaxed px-1">
          <span class="material-symbols-outlined text-[16px]">info</span>
          <span>${esc(l.notice)}</span>
        </p>`;

      document.getElementById("view-lecture").innerHTML = html;
    }

    function navigate(route) {
      window.location.hash = route;
    }

    function route() {
      const id = (window.location.hash || "#home").slice(1);
      const lecture = LECTURES.find(l => l.id === id);
      const home = document.getElementById("view-home");
      const detail = document.getElementById("view-lecture");
      const back = document.getElementById("back-btn");
      if (lecture) {
        renderLecture(lecture);
        home.classList.add("hidden");
        detail.classList.remove("hidden");
        back.classList.remove("hidden");
        document.getElementById("bar-tag").textContent = lecture.badge;
        document.getElementById("bar-title").textContent = lecture.status + " · " + lecture.facts[0].value;
        document.title = lecture.title + " · 강의 허브";
      } else {
        home.classList.remove("hidden");
        detail.classList.add("hidden");
        back.classList.add("hidden");
        document.getElementById("bar-tag").textContent = "AI 교육 특강";
        document.getElementById("bar-title").textContent = "강의 허브";
        document.title = "AI 교육 특강 허브";
      }
      window.scrollTo(0, 0);
    }

    renderHome();
    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
