<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장판의 새벽</title>
<!--
  장판의 새벽 — 삼국지 선택지형 텍스트 어드벤처 (단일 HTML, 외부 라이브러리 없음)
  참고: Twine·ink 같은 선택지형 인터랙티브 픽션의 구조(장면 + 선택지 + 조건 + 변수)를 직접 작은 엔진으로 구현.
        이야기는 『삼국지연의』 41~42회 장판파 대목을 각색했다.
  고치는 법: 아래 STORY 객체만 바꾸면 된다.
    장면 = { place, title, text(문자열 또는 s=>문자열), enter(첫 방문 때 실행), choices:[...] , ending }
    선택지 = { t, go, fx, time(추가 시간), if(s=>보일지), req:{item}(없으면 잠금),
              chance:{base, sword(청강검 보너스), mod(s=>보정)}, ok, fail, fxOk, fxFail, note, noteOk, noteFail }
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--soft:#F0EDEA;--ink:#1B1C1A;--sub:#444841;--cap:#5F635B;--line:#E8E3DB;--accent:#52634C;--accent-pale:#D5E8CB;--accent-ink:#3B4A36;--warn:#99462A;--warn-pale:#F4E2D9}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:20px;letter-spacing:-.01em}
header small{display:block;font-size:13px;color:var(--cap);font-weight:500}
.sp{flex:1}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);font-family:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer}
.tbtn:hover{background:var(--soft)}
.status{background:var(--card);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-bottom:14px}
.stat label{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:600}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.meter.low i{background:var(--warn)}
.time{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);font-weight:600;flex-wrap:wrap}
.pips{display:flex;gap:3px}
.pips span{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.pips span.off{background:var(--soft)}
.items{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--sub);font-weight:600}
.chip{background:var(--soft);color:var(--ink);font-weight:600;font-size:13px;padding:3px 10px;border-radius:99px}
.chip.key{background:var(--accent-pale);color:var(--accent-ink)}
.card{background:var(--card);border-radius:18px;padding:clamp(18px,4vw,30px)}
.place{font-size:13px;color:var(--cap);font-weight:600}
.card h2{font-family:"Noto Serif KR","Batang",serif;font-size:clamp(22px,4vw,27px);margin:2px 0 14px;letter-spacing:-.01em}
.note{border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px;background:var(--soft);color:var(--sub)}
.note.ok{background:var(--accent-pale);color:var(--accent-ink)}
.note.bad{background:var(--warn-pale);color:var(--warn)}
.story p{font-family:"Noto Serif KR","Batang",serif;font-size:17px;line-height:1.85;margin-bottom:14px;word-break:keep-all}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;padding:12px 14px;border-radius:12px;cursor:pointer;width:100%}
.ch:hover:not(:disabled){background:var(--soft);border-color:#D8D2C8}
.ch:focus-visible,.tbtn:focus-visible,.go:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ch b{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px}
.ch:disabled{cursor:not-allowed;color:var(--cap);background:var(--soft)}
.ch:disabled b{background:#B9B4AC}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.meta span{font-size:13px;font-weight:600;color:var(--cap);background:var(--soft);padding:1px 8px;border-radius:99px}
.ch:disabled .meta span{background:var(--card)}
.go{border:0;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;font-size:16px;padding:12px 22px;border-radius:12px;cursor:pointer}
.go.alt{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.grade{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:22px;margin-bottom:6px}
.grade.f{background:var(--warn)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.coll div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--cap)}
.coll div.got{background:var(--accent-pale);color:var(--accent-ink);font-weight:600}
.coll b{margin-right:6px}
h3{font-size:15px;margin-top:22px;color:var(--sub)}
dialog{border:0;border-radius:16px;padding:20px;max-width:560px;width:calc(100% - 32px);color:var(--ink)}
dialog::backdrop{background:rgba(27,28,26,.35)}
dialog ol{padding-left:20px;max-height:60vh;overflow:auto;font-size:15px}
dialog li{margin-bottom:8px}
dialog li small{display:block;color:var(--cap)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:480px){.status{grid-template-columns:1fr}.story p{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>장판의 새벽</h1><small>삼국지 텍스트 어드벤처</small></div>
    <span class="sp"></span>
    <button class="tbtn" id="btnLog" hidden>지나온 길</button>
    <button class="tbtn" id="btnHome" hidden>처음 화면</button>
  </header>
  <section class="status" id="status" hidden></section>
  <main class="card fade" id="main" aria-live="polite"></main>
</div>
<dialog id="logDlg"><h3 style="margin:0 0 10px">지나온 길</h3><ol id="logList"></ol><div class="row"><button class="go alt" id="logClose">닫기</button></div></dialog>

<script>
(() => {
'use strict';
const START_TIME = 16;
const ENDINGS = [
  { id: 'all',    grade: 'S', name: '모두를 구하다' },
  { id: 'true',   grade: 'A', name: '단기구주' },
  { id: 'good',   grade: 'B', name: '주군의 가족을 지키다' },
  { id: 'adou',   grade: 'C', name: '아두를 품고' },
  { id: 'dawn',   grade: 'F', name: '해가 뜨다' },
  { id: 'fallen', grade: 'F', name: '쓰러진 백마' }
];

/* =================== 이야기 =================== */
const STORY = {
  start: {
    place: '당양 장판', title: '새벽의 혼전',
    text: s => s.flags.met_zf
      ? `장판교를 뒤로하고 다시 들판으로 말을 몬다. 먼지 너머로 비명과 말발굽 소리가 끊이지 않는다.\n\n어디부터 찾아야 할까?`
      : `건안 13년 가을, 당양 장판. 조조의 정예 기병이 피난 행렬을 덮친 지 반나절이 지났다.\n\n당신은 상산의 조자룡. 주군 유비의 가솔을 지키라는 명을 받았지만, 혼전 속에 감부인도, 미부인도, 어린 아두 공자도 놓치고 말았다.\n\n동이 트면 조조의 대군이 들판을 완전히 덮을 것이다. 그 전에 찾아야 한다.`,
    choices: [
      { t: '피난민 행렬을 거슬러 남쪽으로 간다', go: 'refugees', if: s => !s.flags.met_gan },
      { t: '언덕에 올라 전장을 살핀다', go: 'hill', time: 1, if: s => !s.flags.scouted },
      { t: '불타는 서쪽 마을로 간다', go: 'village', if: s => s.flags.met_zf },
      { t: '장판교로 가서 장비에게 먼저 알린다', go: 'bridge_early', if: s => !s.flags.met_zf }
    ]
  },
  hill: {
    place: '들판의 언덕', title: '언덕 위에서',
    enter: s => { s.flags.scouted = true; add(s, 'mor', 5); },
    text: `언덕에 오르자 전장이 한눈에 들어온다.\n\n서쪽 마을에서는 검은 연기가 오른다. 남쪽, 무너진 담장 옆 우물가에 흰 옷자락이 언뜻 보였다 사라진다. 북쪽에서는 ‘하후’ 깃발을 단 기병 한 무리가 피난민의 짐을 뒤지고 있다.\n\n동쪽 경산 위, 수많은 깃발 사이로 붉은 일산이 서 있다. 조조가 이 들판을 내려다보고 있다.`,
    choices: [
      { t: '남쪽 우물가로 곧장 내려간다', go: 'well' },
      { t: '서쪽 마을로 간다', go: 'village' },
      { t: '북쪽 ‘하후’ 깃발 쪽으로 간다', go: 'xiahou', if: s => !s.flags.xiahou_done },
      { t: '피난민 행렬 쪽으로 간다', go: 'refugees', if: s => !s.flags.met_gan }
    ]
  },
  bridge_early: {
    place: '장판교', title: '다리 위의 장비',
    enter: s => { s.flags.met_zf = true; },
    text: `장판교에 이르자 장비가 장팔사모를 비껴 들고 다리 한가운데를 막고 서 있다.\n\n“자룡! 미방이 그러던데, 네가 조조에게 항복하러 갔다고? 정말이냐!”\n\n고리눈이 이글거린다. 지체할 시간이 없다.`,
    choices: [
      { t: '“주공의 가솔을 찾으러 가는 길이오. 다리만 지켜 주시오!”', go: 'start', fx: { mor: 5, set: 'zf_trust' }, note: '장비가 고개를 끄덕였다. “꼭 살아서 돌아와라!” (기세 +5)' },
      { t: '대꾸할 틈도 없이 말머리를 돌린다', go: 'start', fx: { mor: -5 }, note: '장비의 고함이 등 뒤에서 들려온다. (기세 −5)' }
    ]
  },
  refugees: {
    place: '피난민 행렬', title: '쓰러진 간옹',
    enter: s => { s.flags.met_gan = true; },
    text: `울부짖는 피난민 틈에서 화살에 맞아 쓰러진 간옹을 찾았다.\n\n“자룡… 감부인께서는 신발도 잃은 채 백성들 틈에 섞여 동쪽 갈대밭으로 가셨소. 미부인과 아두 공자는… 서쪽 마을 쪽에서 봤다는 사람이 있었소.”`,
    choices: [
      { t: '간옹을 부축해 말에 태우고 함께 간다', go: 'lady_gan', time: 1, fx: { mor: 10 }, note: '간옹이 이를 악물고 안장을 붙잡는다. (기세 +10)' },
      { t: '물주머니를 건네고 동쪽으로 서두른다', go: 'lady_gan', req: { item: '물주머니' }, fx: { mor: 5, del: '물주머니' }, note: '간옹이 물을 받아 마시고 손을 흔든다. (기세 +5, 물주머니를 건넸다)' },
      { t: '서쪽 마을로 바로 간다', go: 'village' }
    ]
  },
  lady_gan: {
    place: '동쪽 갈대밭', title: '맨발의 감부인',
    text: `동쪽 갈대밭 가장자리에서 맨발의 감부인을 찾았다.\n\n그러나 그 앞을 조조군 보병들이 막아섰다. 장수 순우도가 결박한 미축을 끌고 오며 소리친다. “거기 흰 말 탄 놈, 멈춰라!”`,
    choices: [
      { t: '단숨에 돌격해 순우도를 벤다', chance: { base: .55, sword: .15 },
        ok: 'gan_after', fxOk: { mor: 10, set: ['rescued_gan', 'mizhu'] }, noteOk: '순우도가 말에서 떨어졌다! 미축의 결박을 끊었다. (기세 +10)',
        fail: 'gan_after', fxFail: { hp: -25, set: ['rescued_gan', 'mizhu'] }, noteFail: '창끝이 빗나가 어깨를 베였다. 간신히 순우도를 쓰러뜨렸다. (체력 −25)' },
      { t: '싸움을 피해 감부인만 안장에 태우고 갈대밭을 돌아 나간다', go: 'gan_after', time: 1, fx: { mor: -5, set: 'rescued_gan' }, note: '미축은 끝내 끌려가고 말았다. (기세 −5)' }
    ]
  },
  gan_after: {
    place: '동쪽 갈대밭', title: '감부인을 보내다',
    text: s => (s.flags.mizhu
      ? `미축이 감부인을 자기 말에 모신다. “장군, 부인은 제가 장판교까지 모시겠습니다.”`
      : `지나가던 패잔병들에게 감부인을 장판교까지 모시라 이른다. 미축을 구하지 못한 것이 마음에 걸린다.`)
      + `\n\n“미부인과 아두 공자를 찾기 전에는 돌아가지 않겠소.”`,
    choices: [
      { t: '서쪽 마을로 간다', go: 'village' },
      { t: '남쪽 우물가로 간다', go: 'well', if: s => s.flags.scouted },
      { t: '언덕에 올라 전장을 살핀다', go: 'hill', time: 1, if: s => !s.flags.scouted }
    ]
  },
  village: {
    place: '서쪽 마을', title: '불탄 마을',
    text: `불탄 마을에는 사람의 기척이 없다. 무너진 집 사이에서 아이 울음소리가 들린 듯하다 끊긴다.\n\n마을 어귀에 숨어 있던 노인이 손짓한다. “흰 옷 입은 부인이 아기를 안고 남쪽 우물가로 가셨소. 다리를 다치셨더이다.”`,
    choices: [
      { t: '남쪽 우물가로 서두른다', go: 'well' },
      { t: '노인에게 말린 고기를 나눠 준다', go: 'village_tip', req: { item: '말린 고기' } },
      { t: '북쪽 ‘하후’ 깃발 쪽으로 간다', go: 'xiahou', if: s => !s.flags.xiahou_done }
    ]
  },
  village_tip: {
    place: '서쪽 마을', title: '노인의 귀띔',
    enter: s => { del(s, '말린 고기'); s.flags.info_path = true; add(s, 'mor', 5); },
    text: `노인이 고기를 받아 들고 목이 메어 말한다.\n\n“장군, 큰길로 가지 마시오. 장판교 가는 큰길 양쪽에 조조군이 숨어 있소. 우물 뒤편 북쪽 샛길로 돌면 놈들 눈을 피할 수 있을 게요.”\n\n“그리고 북쪽에서 약탈하는 하후은이라는 자는 조조의 보검을 차고 다닌다 하오.”`,
    choices: [
      { t: '남쪽 우물가로 간다', go: 'well' },
      { t: '북쪽으로 하후은을 찾아간다', go: 'xiahou', if: s => !s.flags.xiahou_done }
    ]
  },
  xiahou: {
    place: '북쪽 길목', title: '청강검의 주인',
    enter: s => { s.flags.xiahou_done = true; },
    text: `피난민의 짐을 뒤지던 장수가 고개를 든다. 허리에 찬 칼집에 금빛으로 ‘청강(靑釭)’ 두 글자가 새겨져 있다. 조조의 보검을 맡아 지키는 하후은이다.\n\n“하하! 혼자서 무엇을 하겠다고!”`,
    choices: [
      { t: '말을 박차 단 일합에 승부를 낸다', chance: { base: .5 },
        ok: 'after_xiahou', fxOk: { mor: 15, add: '청강검' }, noteOk: '단 한 번 창이 번뜩이자 하후은이 말에서 떨어졌다. 청강검을 손에 넣었다! (기세 +15)',
        fail: 'after_xiahou', fxFail: { hp: -30, mor: -5 }, noteFail: '하후은의 칼끝이 갑옷을 찢었다. 그는 호위병 뒤로 숨어 달아났다. (체력 −30, 기세 −5)' },
      { t: '상대하지 않고 남쪽으로 돌아간다', go: 'well', time: 1 }
    ]
  },
  after_xiahou: {
    place: '북쪽 길목', title: '보검',
    text: s => has(s, '청강검')
      ? `청강검을 뽑아 보니 칼날이 새벽빛을 받아 서늘하게 빛난다. 쇠도 진흙처럼 벤다는 보검이다.\n\n(청강검: 돌파할 때 성공 확률이 오른다)`
      : `하후은은 사라졌다. 쫓을 시간이 없다. 상처를 동여매고 다시 말에 오른다.`,
    choices: [
      { t: '남쪽 우물가로 간다', go: 'well' },
      { t: '동쪽 갈대밭으로 감부인을 찾아간다', go: 'lady_gan', if: s => s.flags.met_gan && !s.flags.rescued_gan },
      { t: '피난민 행렬 쪽으로 간다', go: 'refugees', if: s => !s.flags.met_gan }
    ]
  },
  well: {
    place: '무너진 담장', title: '우물가의 미부인',

/* =================== 엔진 =================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const SAVE = 'jangpan_save', GOT = 'jangpan_endings';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const val = (v, s) => typeof v === 'function' ? v(s) : v;
function has(s, i) { return s.items.includes(i); }
function add(s, k, n) { s[k] = clamp(s[k] + n, 0, 100); }
function del(s, i) { s.items = s.items.filter(x => x !== i); }
const list = v => v == null ? [] : [].concat(v);
let S = null;

function newState() { return { scene: 'start', hp: 100, mor: 50, time: START_TIME, items: ['물주머니', '말린 고기'], flags: {}, seen: {}, log: [], note: '', noteKind: '' }; }
function apply(fx) {
  if (!fx) return;
  if (fx.hp) add(S, 'hp', fx.hp);
  if (fx.mor) add(S, 'mor', fx.mor);
  list(fx.add).forEach(i => { if (!has(S, i)) S.items.push(i); });
  list(fx.del).forEach(i => del(S, i));
  list(fx.set).forEach(f => { S.flags[f] = true; });
}
const prob = c => clamp(c.base + (S.mor - 50) / 200 + (has(S, '청강검') ? (c.sword || 0) : 0) + (c.mod ? c.mod(S) : 0), .05, .95);
const locked = c => c.req && c.req.item && !has(S, c.req.item);

function choose(c) {
  if (locked(c)) return;
  let to = c.go, fx = c.fx, note = c.note || '', kind = '';
  if (c.chance) {
    const p = prob(c.chance), ok = Math.random() < p;
    to = ok ? c.ok : c.fail; fx = ok ? c.fxOk : c.fxFail; note = ok ? c.noteOk : c.noteFail; kind = ok ? 'ok' : 'bad';
    note = `${ok ? '성공' : '실패'} (확률 ${Math.round(p * 100)}%) · ${note || ''}`;
  }
  S.log.push({ title: STORY[S.scene].title, choice: c.t, note });
  apply(fx);
  S.time -= 1 + (c.time || 0);
  S.note = note; S.noteKind = kind;
  to = val(to, S);
  if (S.hp <= 0) to = 'end_fallen';
  else if (S.time < 0 && !STORY[to].ending) to = 'end_dawn';
  go(to);
}
function go(id) {
  S.scene = id;
  const sc = STORY[id];
  if (sc.enter && !S.seen[id]) sc.enter(S);
  S.seen[id] = true;
  if (S.hp <= 0 && !sc.ending) return go('end_fallen');
  if (sc.ending) {
    const got = store.get(GOT, []);
    if (!got.includes(sc.ending)) { got.push(sc.ending); store.set(GOT, got); }
    store.del(SAVE);
  } else store.set(SAVE, S);
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =================== 화면 =================== */
function renderStatus() {
  const st = $('status'); st.hidden = false;
  const pips = Array.from({ length: START_TIME }, (_, i) => `<span class="${i < S.time ? '' : 'off'}"></span>`).join('');
  st.innerHTML = `
    <div class="stat"><label><span>체력</span><span>${S.hp}</span></label><div class="meter ${S.hp < 30 ? 'low' : ''}"><i style="width:${S.hp}%"></i></div></div>
    <div class="stat"><label><span>기세</span><span>${S.mor}</span></label><div class="meter"><i style="width:${S.mor}%"></i></div></div>
    <div class="time"><span>동트기까지 ${Math.max(0, S.time)}각</span><span class="pips">${pips}</span></div>
    <div class="items"><span>소지품</span>${S.items.length ? S.items.map(i => `<span class="chip ${i === '청강검' || i === '아두' ? 'key' : ''}">${esc(i)}</span>`).join('') : '<span class="chip">없음</span>'}</div>`;
}
function collection() {
  const got = store.get(GOT, []);
  return `<h3>엔딩 수집 ${got.length} / ${ENDINGS.length}</h3><div class="coll">${ENDINGS.map(e => got.includes(e.id)
    ? `<div class="got"><b>${e.grade}</b>${esc(e.name)}</div>` : `<div><b>${e.grade}</b>???</div>`).join('')}</div>`;
}
function renderTitle() {
  $('status').hidden = true; $('btnLog').hidden = true; $('btnHome').hidden = true;
  const saved = store.get(SAVE, null);
  const m = $('main');
  m.innerHTML = `
    <div class="place">건안 13년 · 당양 장판</div>
    <h2>장판의 새벽</h2>
    <div class="story"><p>조조의 기병이 피난 행렬을 덮쳤다. 당신은 조자룡이 되어, 동이 트기 전에 흩어진 주군의 가족을 찾아 장판교로 돌아와야 한다.</p>
    <p>선택마다 시간이 흐르고, 싸움은 기세와 운에 달려 있다. 엔딩은 여섯 가지다.</p></div>
    <div class="row">
      <button class="go" id="btnNew">${saved ? '새로 시작' : '시작하기'}</button>
      ${saved ? `<button class="go alt" id="btnCont">이어하기 · ${esc(STORY[saved.scene] ? STORY[saved.scene].title : '')}</button>` : ''}
    </div>
    ${collection()}`;
  $('btnNew').onclick = () => { S = newState(); go('start'); };
  if (saved && STORY[saved.scene]) $('btnCont').onclick = () => { S = saved; render(); };
  m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
  $('btnNew').focus();
}
function render() {
  if (!S) return renderTitle();
  $('btnLog').hidden = false; $('btnHome').hidden = false;
  const sc = STORY[S.scene], m = $('main');
  const paras = val(sc.text, S).split('\n\n').map(p => `<p>${esc(p)}</p>`).join('');
  const note = S.note ? `<div class="note ${S.noteKind}">${esc(S.note)}</div>` : '';
  if (sc.ending) {
    renderStatus();
    const e = ENDINGS.find(x => x.id === sc.ending);
    m.innerHTML = `${note}<div class="grade ${e.grade === 'F' ? 'f' : ''}">${e.grade}</div><div class="place">엔딩 · ${esc(sc.place)}</div><h2>${esc(sc.title)}</h2>
      <div class="story">${paras}</div>
      <div class="row"><button class="go" id="btnAgain">처음부터 다시</button><button class="go alt" id="btnSeeLog">지나온 길 보기</button></div>${collection()}`;
    $('btnAgain').onclick = () => { S = newState(); go('start'); };
    $('btnSeeLog').onclick = openLog;
  } else {
    renderStatus();
    const shown = sc.choices.filter(c => c.if ? c.if(S) : true);
    m.innerHTML = `${note}<div class="place">${esc(sc.place)}</div><h2>${esc(sc.title)}</h2><div class="story">${paras}</div>
      <div class="choices">${shown.map((c, i) => {
        const meta = [];
        if (c.chance) meta.push(`성공 확률 ${Math.round(prob(c.chance) * 100)}%`);
        if (c.time) meta.push(`시간 ${c.time + 1}각`);
        if (locked(c)) meta.push(`필요: ${c.req.item}`);
        return `<button class="ch" data-i="${i}" ${locked(c) ? 'disabled' : ''}><b>${i + 1}</b><span>${esc(c.t)}${meta.length ? `<span class="meta">${meta.map(x => `<span>${esc(x)}</span>`).join('')}</span>` : ''}</span></button>`;
      }).join('')}</div>`;
    m.querySelectorAll('.ch').forEach(b => b.onclick = () => choose(shown[+b.dataset.i]));
    const first = m.querySelector('.ch:not(:disabled)'); if (first) first.focus({ preventScroll: true });
  }
  m.classList.remove('fade'); void m.offsetWidth; m.classList.add('fade');
}
function openLog() {
  $('logList').innerHTML = S && S.log.length
    ? S.log.map(l => `<li><b>${esc(l.title)}</b> — ${esc(l.choice)}${l.note ? `<small>${esc(l.note)}</small>` : ''}</li>`).join('')
    : '<li>아직 지나온 길이 없습니다.</li>';
  $('logDlg').showModal();
}
$('btnLog').onclick = openLog;
$('logClose').onclick = () => $('logDlg').close();
$('btnHome').onclick = () => { S = null; renderTitle(); };
addEventListener('keydown', e => {
  if ($('logDlg').open || !S || STORY[S.scene].ending) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { const b = document.querySelector(`.ch[data-i="${n - 1}"]`); if (b && !b.disabled) b.click(); }
});
renderTitle();
})();
</script>
</body>
</html>
