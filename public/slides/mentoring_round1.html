<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1차 온라인 멘토링 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#1C1B19; --sub:#5E5B55; --line:#E4E1DA; --soft:#EFEDE7;
  --accent:#B4581E; --accent-soft:#FBEBDD; --accent-ink:#7A3A12;
}
body[data-team="okjong"]{ --accent:#2F6B5B; --accent-soft:#DFF0EA; --accent-ink:#1D4A3E; }
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 64px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .date{font-size:.85rem;color:var(--sub);font-weight:600}
.top nav a{font-size:.8rem;color:var(--sub);text-decoration:none;margin-left:12px}
.top nav a:hover{color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tab{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;font:inherit;color:var(--sub)}
.tab strong{display:block;font-size:1.15rem;color:var(--ink)}
.tab span{font-size:.85rem}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] span{color:var(--accent-ink)}

/* 팀 헤더 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px}
.hero h1{margin:0 0 4px;font-size:1.7rem;line-height:1.3}
.hero p{margin:0;color:var(--sub)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.pill.hot{background:var(--accent);color:#fff}

/* 진행 순서 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:26px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.step b{display:block;font-size:.78rem;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.step span{font-size:.88rem;line-height:1.45;display:block}

h2{font-size:1.25rem;margin:30px 0 4px;display:flex;align-items:baseline;gap:10px}
h2 .n{font-size:.85rem;color:var(--accent);font-weight:800}
.lead{margin:0 0 14px;color:var(--sub);font-size:.92rem}

/* 질문 카드 */
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.q-head{display:flex;gap:12px;align-items:flex-start}
.q-no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem;margin-top:2px}
.q-text{font-size:1.18rem;font-weight:700;line-height:1.5;margin:0}
.q-tag{font-size:.78rem;color:var(--accent-ink);font-weight:700;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0 42px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.memo{display:block;width:calc(100% - 42px);margin:10px 0 0 42px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:.95rem;background:#FCFBF8;resize:vertical;min-height:44px}
.memo:focus,.add input:focus,.dec textarea:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
details.fb{margin:12px 0 0 42px}
details.fb summary{cursor:pointer;font-size:.88rem;font-weight:700;color:var(--accent-ink);list-style:none}
details.fb summary::-webkit-details-marker{display:none}
details.fb summary::before{content:"▸ ";}
details.fb[open] summary::before{content:"▾ ";}
details.fb div{margin-top:8px;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.95rem;color:var(--ink)}
details.fb div p{margin:0 0 6px}
details.fb div p:last-child{margin:0}

/* 의견 보드 */
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:150px;display:flex;flex-direction:column}
.cell h3{margin:0 0 8px;font-size:1rem}
.cell h3 small{font-weight:600;color:var(--sub);font-size:.8rem;margin-left:4px}
.cell ul{list-style:none;margin:0 0 8px;padding:0;flex:1}
.cell li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.cell li .t{flex:1}
.cell li select{font:inherit;font-size:.78rem;border:1px solid var(--line);border-radius:8px;padding:2px 4px;background:var(--soft);color:var(--sub)}
.cell li select.c1{background:#E3ECFA;color:#1E4A8A;border-color:#C9D9F2}
.cell li select.c2{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.cell li select.c3{background:#EEE;color:#777}
.cell li .x{appearance:none;border:0;background:none;color:#A39E95;cursor:pointer;font-size:1rem;padding:0 2px}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.92rem;background:#FCFBF8}
.add button{appearance:none;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:.9rem;padding:0 14px;cursor:pointer}
.legend{font-size:.82rem;color:var(--sub);margin:10px 0 0}

/* 결정 메모 */
.dec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px}
.dec label{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--soft)}
.dec label:last-child{border-bottom:0}
.dec label span{font-weight:700;font-size:.95rem;padding-top:6px}
.dec label span small{display:block;font-weight:500;color:var(--sub);font-size:.8rem}
.dec textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:.95rem;background:#FCFBF8;resize:vertical;min-height:42px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
.toast{font-size:.88rem;color:var(--accent-ink);align-self:center}
.out{display:block;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:.88rem;background:#FCFBF8;min-height:220px}

/* 다음 일정 */
.next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.next div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.next b{display:block;font-size:.8rem;color:var(--accent-ink)}
.next span{font-size:.92rem}
.foot{margin-top:28px;font-size:.78rem;color:var(--sub)}

@media (max-width:760px){
  html{font-size:16px}
  .wrap{padding:16px 16px 48px}
  .steps{grid-template-columns:1fr 1fr}
  .board,.next{grid-template-columns:1fr}
  .chips,.memo,details.fb{margin-left:0}
  .memo{width:100%}
  .dec label{grid-template-columns:1fr;gap:4px}
}
@media print{.tabs,.top nav,.actions,.add,.cell li .x{display:none}}
</style>
</head>

        ['unit', '첫 단원과 개념 3개', ''],
        ['platform', '플랫폼과 결정 조건', '예: Godot 작은 시도 ①~③까지 되면 유지'],
        ['todo', '역할별 다음 작업', '팀장(웹·AI): \n디자인·발표: \n앱·QA: '],
        ['help', '운영사가 도울 것', '']
      ]
    }
  };

  var BOARD = [
    ['fnNew', '기능', '새로 만들고 싶은 것'],
    ['fnFix', '기능', '고치고 싶은 것'],
    ['uiNew', 'UI', '새로 만들고 싶은 것'],
    ['uiFix', 'UI', '고치고 싶은 것']
  ];
  var CATS = ['분류 전', '운영사 보완', 'v1 학생 과제', '나중에'];
  var PREFIX = 'code_round1_v2_';

  var MEM = {};
  function load(t){
    if (MEM[t]) return MEM[t];
    var s = {}; try { s = JSON.parse(localStorage.getItem(PREFIX + t)) || {}; } catch(e){}
    return (MEM[t] = s);
  }
  function save(t, s){ MEM[t] = s; try { localStorage.setItem(PREFIX + t, JSON.stringify(s)); } catch(e){} }
  function el(tag, attrs, html){
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var current, state;
  var app = document.getElementById('app');

  function render(t){
    current = t; state = load(t);
    state.q = state.q || {}; state.b = state.b || {}; state.d = state.d || {};
    var T = TEAMS[t];
    document.body.setAttribute('data-team', t);
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-t') === t ? 'true' : 'false'); });
    try { history.replaceState(null, '', '#' + t); } catch(e){}
    app.innerHTML = '';

    var hero = el('section', {class:'hero'});
    hero.innerHTML = '<h1>' + esc(T.name) + '</h1><p>' + esc(T.sub) + '</p>' +
      '<div class="meta"><span class="pill hot">' + esc(T.time) + '</span>' +
      T.roles.map(function(r){ return '<span class="pill">' + esc(r) + '</span>'; }).join('') +
      '<span class="pill">v1 마감 10.29(목) 23:59</span></div>';
    app.appendChild(hero);

    var steps = el('div', {class:'steps'});
    T.steps.forEach(function(s){ steps.appendChild(el('div', {class:'step'}, '<b>' + s[0] + '</b><span>' + esc(s[1]) + '</span>')); });
    app.appendChild(steps);

    // 1. v0 의견
    app.appendChild(el('h2', null, '<span class="n">01</span>v0 써 보니 어땠어요?'));
    app.appendChild(el('p', {class:'lead'}, '생각나는 대로 전부 받아요. 분류는 나중에 해도 돼요.'));
    var board = el('div', {class:'board'});
    BOARD.forEach(function(b){
      var key = b[0]; state.b[key] = state.b[key] || [];
      var cell = el('div', {class:'cell'});
      cell.appendChild(el('h3', null, b[1] + ' <small>' + b[2] + '</small>'));
      var ul = el('ul'); cell.appendChild(ul);
      function draw(){
        ul.innerHTML = '';
        state.b[key].forEach(function(item, i){
          var li = el('li');
          li.appendChild(el('span', {class:'t'}, esc(item.t)));
          var sel = el('select', {'aria-label':'분류', class: item.c ? 'c' + item.c : ''});
          CATS.forEach(function(c, ci){ var o = el('option', {value: ci}, c); if (ci === (item.c || 0)) o.selected = true; sel.appendChild(o); });
          sel.addEventListener('change', function(){ item.c = +sel.value; sel.className = item.c ? 'c' + item.c : ''; save(current, state); });
          li.appendChild(sel);
          var x = el('button', {class:'x', 'aria-label':'삭제', title:'삭제'}, '×');
          x.addEventListener('click', function(){ state.b[key].splice(i, 1); save(current, state); draw(); });
          li.appendChild(x);
          ul.appendChild(li);
        });
      }
      draw();
      var add = el('form', {class:'add'});
      var inp = el('input', {type:'text', placeholder:'의견 입력 후 Enter'});
      add.appendChild(inp); add.appendChild(el('button', {type:'submit'}, '추가'));
      add.addEventListener('submit', function(e){
        e.preventDefault(); var v = inp.value.trim(); if (!v) return;
        state.b[key].push({t:v, c:0}); save(current, state); inp.value = ''; draw(); inp.focus();
      });
      cell.appendChild(add);
      board.appendChild(cell);
    });
    app.appendChild(board);
    app.appendChild(el('p', {class:'legend'}, '분류: <b>운영사 보완</b>(우리가 고쳐 줄 것) · <b>v1 학생 과제</b>(10.29까지 직접 할 것) · <b>나중에</b>(이후 회차)'));

    // 2. 핵심 질문
    app.appendChild(el('h2', null, '<span class="n">02</span>오늘 꼭 물어볼 질문'));
    app.appendChild(el('p', {class:'lead'}, '학생 답을 먼저 듣고, 그다음 ▸ 멘토 피드백을 열어 이야기해요.'));
    T.qs.forEach(function(q, i){
      var id = 'q' + i; var s = state.q[id] = state.q[id] || {};
      var card = el('div', {class:'q'});
      card.appendChild(el('div', {class:'q-head'}, '<span class="q-no">' + (i + 1) + '</span><div><div class="q-tag">' + esc(q.tag) + '</div><p class="q-text">' + esc(q.q) + '</p></div>'));
      if (q.choices){
        var chips = el('div', {class:'chips'});
        q.choices.forEach(function(c){
          var b = el('button', {class:'chip', type:'button', 'aria-pressed': s.c === c ? 'true' : 'false'}, esc(c));
          b.addEventListener('click', function(){
            s.c = (s.c === c) ? '' : c; save(current, state);
            chips.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x.textContent === s.c ? 'true' : 'false'); });
          });
          chips.appendChild(b);
        });
        card.appendChild(chips);
      }
      var memo = el('textarea', {class:'memo', rows:'1', placeholder:'학생 답 메모'});
      memo.value = s.m || '';
      memo.addEventListener('input', function(){ s.m = memo.value; save(current, state); });
      card.appendChild(memo);
      var d = el('details', {class:'fb'});
      d.appendChild(el('summary', null, '멘토 피드백'));
      d.appendChild(el('div', null, q.fb.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('')));
      card.appendChild(d);
      app.appendChild(card);
    });

    // 3. 결정
    app.appendChild(el('h2', null, '<span class="n">03</span>오늘의 결정'));
    app.appendChild(el('p', {class:'lead'}, '실제로 정해진 것만 적어요. 안 정해졌으면 비워 둬요.'));
    var dec = el('div', {class:'dec'});
    T.dec.forEach(function(row){
      var lab = el('label');
      lab.appendChild(el('span', null, esc(row[1])));
      var ta = el('textarea', {rows: row[0] === 'todo' ? '3' : '1', placeholder: row[2]});
      ta.value = state.d[row[0]] || '';
      ta.addEventListener('input', function(){ state.d[row[0]] = ta.value; save(current, state); });
      lab.appendChild(ta);
      dec.appendChild(lab);
    });
    app.appendChild(dec);

    var act = el('div', {class:'actions'});
    var copyBtn = el('button', {class:'btn', type:'button'}, '📋 일지용 메모 복사');
    var resetBtn = el('button', {class:'btn ghost', type:'button'}, '이 팀 메모 지우기');
    var toast = el('span', {class:'toast', role:'status'});
    var out = el('textarea', {class:'out', readonly:'', 'aria-label':'일지용 메모'}); out.hidden = true;
    copyBtn.addEventListener('click', function(){
      out.value = summary(); out.hidden = false;
      copy(out.value, toast, function(){ out.focus(); out.select(); });
    });
    resetBtn.addEventListener('click', function(){
      if (!confirm(T.name + ' 메모를 모두 지울까요?')) return;
      delete MEM[current]; try { localStorage.removeItem(PREFIX + current); } catch(e){}
      render(current);
    });
    act.appendChild(copyBtn); act.appendChild(resetBtn); act.appendChild(toast);
    app.appendChild(act);
    app.appendChild(out);

    // 4. 다음 일정
    app.appendChild(el('h2', null, '<span class="n">04</span>다음 일정'));
    var nx = el('div', {class:'next'});
    nx.innerHTML = '<div><b>10.29(목) 23:59</b><span>v1 드라이브 업로드<br>' + esc(T.file) + '</span></div>' +
      '<div><b>10.31(토) ~ 11.1(일)</b><span>오프라인 통합 멘토링<br>v1 함께 리뷰</span></div>' +
      '<div><b>' + (t === 'guil' ? '12.11(금)' : '12.12(토)') + '</b><span>본선 · DDP 아트홀</span></div>';
    app.appendChild(nx);
    document.title = '1차 온라인 멘토링 보드 · ' + T.name;
  }

  function summary(){
    var T = TEAMS[current], L = [];
    L.push('[' + T.name + '] 1차 온라인 멘토링 ' + T.time);
    L.push('', '■ v0 써 본 의견');
    BOARD.forEach(function(b){
      var items = state.b[b[0]] || [];
      if (!items.length) return;
      L.push('[' + b[1] + ' · ' + b[2] + ']');
      items.forEach(function(it){ L.push('- ' + it.t + (it.c ? ' (' + CATS[it.c] + ')' : '')); });
    });
    L.push('', '■ 핵심 질문');
    T.qs.forEach(function(q, i){
      var s = state.q['q' + i] || {};
      var a = [s.c, (s.m || '').trim()].filter(Boolean).join(' / ');
      L.push((i + 1) + '. ' + q.tag + ': ' + (a || '(미정)'));
    });
    L.push('', '■ 오늘의 결정');
    T.dec.forEach(function(r){
      var v = (state.d[r[0]] || '').trim();
      L.push('- ' + r[1] + ': ' + (v ? (v.indexOf('\n') > -1 ? '\n  ' + v.replace(/\n/g, '\n  ') : v) : '(미정)'));
    });
    return L.join('\n');
  }

  function copy(text, toast, onFail){
    function done(ok){ toast.textContent = ok ? '복사했어요. 일지에 붙여 넣으세요.' : '자동 복사가 안 됐어요. 아래 내용을 Ctrl+C로 복사해 주세요.'; if (!ok && onFail) onFail(); setTimeout(function(){ toast.textContent = ''; }, 5000); }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta); done(ok);
    }
  }

  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ render(b.getAttribute('data-t')); }); });
  var h = (location.hash || '').replace('#', '');
  render(TEAMS[h] ? h : (new Date().getHours() >= 18 ? 'okjong' : 'guil'));
})();
</script>
</body>
</html>
