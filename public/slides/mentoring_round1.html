<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1차 온라인 멘토링 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --ink:#1C1B19; --sub:#5E5B55; --line:#E4E1DA; --soft:#EFEDE7;
  --accent:#B4581E; --accent-soft:#FBEBDD; --accent-ink:#7A3A12;
}
body[data-team="okjong"]{ --accent:#2F6B5B; --accent-soft:#DFF0EA; --accent-ink:#1D4A3E; }
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 64px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .date{font-size:.85rem;color:var(--sub);font-weight:600}
.top nav a{font-size:.8rem;color:var(--sub);text-decoration:none;margin-left:12px}
.top nav a:hover{color:var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tab{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;font:inherit;color:var(--sub)}
.tab strong{display:block;font-size:1.15rem;color:var(--ink)}
.tab span{font-size:.85rem}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab[aria-selected="true"] span{color:var(--accent-ink)}

.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px}
.hero h1{margin:0 0 4px;font-size:1.7rem;line-height:1.3}
.hero p{margin:0;color:var(--sub)}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.pill.hot{background:var(--accent);color:#fff}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.step b{display:block;font-size:.78rem;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.step span{font-size:.88rem;line-height:1.45;display:block}

h2{font-size:1.25rem;margin:32px 0 4px;display:flex;align-items:baseline;gap:10px}
h2 .n{font-size:.85rem;color:var(--accent);font-weight:800}
.lead{margin:0 0 14px;color:var(--sub);font-size:.92rem}

/* 00 사전 응답 요약 */
.survey{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:grid;grid-template-columns:34px 170px 1fr;gap:12px;padding:11px 18px;border-bottom:1px solid var(--soft);align-items:baseline}
.srow:last-child{border-bottom:0}
.srow .no{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.srow .qq{font-weight:700;font-size:.92rem;color:var(--sub)}
.srow .aa{font-size:.98rem}
.srow.empty .aa{color:#A39E95}

/* 01 v0 의견 */
.v0bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem;color:var(--accent-ink)}
.v0bar a{background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:6px 12px;border-radius:10px;font-size:.88rem}
.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cell h3{margin:0 0 8px;font-size:1.05rem}
.cell h3 small{font-weight:500;color:var(--sub);font-size:.82rem;margin-left:6px}

textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;background:#FCFBF8;resize:vertical;line-height:1.55}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.cell textarea{min-height:180px}

/* 02 항목 카드 */
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.item h3{margin:0 0 12px;font-size:1.12rem;display:flex;gap:10px;align-items:baseline}
.item h3 .no{color:var(--accent);font-weight:800;font-size:.95rem;flex:none}
.part{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}
.part .lab{font-size:.8rem;font-weight:800;color:var(--sub);padding-top:3px;letter-spacing:.02em}
.part ul{margin:0;padding-left:18px}
.part li{margin:2px 0}
.part.fb .lab{color:var(--accent-ink)}
.part.fb .body{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.part.fb .body p{margin:0 0 6px}
.part.fb .body p:last-child{margin:0}
.part.ask .body{font-weight:700;font-size:1.05rem}
.part.memo textarea{min-height:64px}
.empty-note{color:#A39E95}

/* 03 정리 프롬프트 */
.extra textarea{min-height:110px;background:var(--card)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
.toast{font-size:.88rem;color:var(--accent-ink);align-self:center}
.out{margin-top:12px;min-height:280px;font-size:.86rem}

.next{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.next div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.next b{display:block;font-size:.8rem;color:var(--accent-ink)}
.next span{font-size:.92rem}
.foot{margin-top:28px;font-size:.78rem;color:var(--sub)}

@media (max-width:760px){
  html{font-size:16px}
  .wrap{padding:16px 16px 48px}
  .steps{grid-template-columns:1fr 1fr}
  .board,.next{grid-template-columns:1fr}
  .srow{grid-template-columns:28px 1fr}
  .srow .aa{grid-column:2}
  .part{grid-template-columns:1fr;gap:4px}
}
@media print{.tabs,.top nav,.actions,.v0bar a{display:none}}
</style>
</head>

          ask: '여러분이 머릿속에 그리는 "가르치기 → 기억 → 시험" 화면은 어떤 모습인가요? 버디가 성장한다는 느낌을 어떻게 보여주고 싶나요?' },

               '💡 마스크 & seed 고민 덜기: AI 모델 내부에 마스크를 씌우거나 seed를 고정하지 않아도 괜찮아요(seed는 말투 주사위 값이라 대화를 기억하진 못해요). 대신 우리 앱 안에 "버디가 배운 메모장"을 만들어 두고, 프롬프트에 "너는 지금 이 메모장에 적힌 개념만 아는 상태야. 부족하면 갸웃거리며 되물어봐"라고 넣어주는 방식은 어떨까요?',

          ask: '오늘 이야기 들은 것 중에 "이 방식 괜찮겠다!" 싶은 게 있었나요? 다음 미팅 전까지 부담 없이 먼저 만들어 보고 싶은 화면 한 장은 무엇인가요?' }

  var PREFIX = 'code_round1_v3_';
  var MEM = {};
  function load(t){
    if (MEM[t]) return MEM[t];
    var s = {}; try { s = JSON.parse(localStorage.getItem(PREFIX + t)) || {}; } catch(e){}
    return (MEM[t] = s);
  }
  function save(t, s){ MEM[t] = s; try { localStorage.setItem(PREFIX + t, JSON.stringify(s)); } catch(e){} }
  function el(tag, attrs, html){
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  var current, state;
  var app = document.getElementById('app');

  function bindText(ta, obj, key){
    ta.value = obj[key] || '';
    ta.addEventListener('input', function(){ obj[key] = ta.value; save(current, state); });
  }

  function render(t){
    current = t; state = load(t);
    state.v0 = state.v0 || {}; state.m = state.m || {};
    var T = TEAMS[t];
    document.body.setAttribute('data-team', t);
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-t') === t ? 'true' : 'false'); });
    try { history.replaceState(null, '', '#' + t); } catch(e){}
    app.innerHTML = '';

    var hero = el('section', {class:'hero'});
    hero.innerHTML = '<h1>' + esc(T.name) + '</h1><p>' + esc(T.sub) + '</p>' +
      '<div class="meta"><span class="pill hot">' + esc(T.time) + '</span>' +
      T.roles.map(function(r){ return '<span class="pill">' + esc(r) + '</span>'; }).join('') +
      '<span class="pill">v1 마감 10.29(목) 23:59</span></div>';
    app.appendChild(hero);

    var steps = el('div', {class:'steps'});
    T.steps.forEach(function(s){ steps.appendChild(el('div', {class:'step'}, '<b>' + s[0] + '</b><span>' + esc(s[1]) + '</span>')); });
    app.appendChild(steps);

    // 00 사전 질문 요약
    app.appendChild(el('h2', null, '<span class="n">00</span>사전 질문에 이렇게 답해 줬어요'));
    app.appendChild(el('p', {class:'lead'}, '미팅 전에 적어 준 8문항의 핵심이에요.'));
    var sv = el('div', {class:'survey'});
    T.survey.forEach(function(a, i){
      sv.appendChild(el('div', {class:'srow' + (a ? '' : ' empty')},
        '<span class="no">' + (i + 1) + '</span><span class="qq">' + esc(Q[i]) + '</span><span class="aa">' + (a ? esc(a) : '비어 있음 · 오늘 같이 정해요') + '</span>'));
    });
    app.appendChild(sv);

    // 01 v0 의견
    app.appendChild(el('h2', null, '<span class="n">01</span>v0 써 보니 어땠어요?'));
    var bar = el('div', {class:'v0bar'});
    bar.innerHTML = '<span>아직 안 써 봤다면 화면 공유로 같이 열어 보고 이야기해요.</span><a href="' + T.app + '" target="_blank" rel="noopener">v0 열기 ↗</a>';
    app.appendChild(bar);
    var board = el('div', {class:'board'});
    [['fn', '기능', '되는 것·안 되는 것·더 있으면 좋겠는 것'], ['ui', 'UI', '화면·캐릭터·글자·색·버튼']].forEach(function(b){
      var cell = el('div', {class:'cell'});
      cell.appendChild(el('h3', null, b[1] + '<small>' + b[2] + '</small>'));
      var ta = el('textarea', {placeholder:'학생들이 말하는 대로 받아 적기'});
      bindText(ta, state.v0, b[0]);
      cell.appendChild(ta);
      board.appendChild(cell);
    });
    app.appendChild(board);

    // 02 항목별 피드백
    app.appendChild(el('h2', null, '<span class="n">02</span>사전 질문 항목별 피드백'));
    app.appendChild(el('p', {class:'lead'}, '학생 답 → 멘토 피드백 → 물어볼 것 → 학생 의견 순서로 이야기해요.'));
    T.items.forEach(function(it, i){
      var card = el('section', {class:'item'});
      card.appendChild(el('h3', null, '<span class="no">' + esc(it.no) + '</span>' + esc(it.title)));
      card.appendChild(el('div', {class:'part ans'}, '<span class="lab">학생 답</span><div class="body">' +
        (it.ans.length ? '<ul>' + it.ans.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '<span class="empty-note">비어 있음</span>') + '</div>'));
      card.appendChild(el('div', {class:'part fb'}, '<span class="lab">멘토 피드백</span><div class="body">' + it.fb.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>'));
      card.appendChild(el('div', {class:'part ask'}, '<span class="lab">물어볼 것</span><div class="body">' + esc(it.ask) + '</div>'));
      var mp = el('div', {class:'part memo'});
      mp.appendChild(el('span', {class:'lab'}, '학생 의견'));
      var ta = el('textarea', {placeholder:'학생 답과 오늘 정해진 것을 받아 적기'});
      bindText(ta, state.m, 'i' + i);
      mp.appendChild(ta);
      card.appendChild(mp);
      app.appendChild(card);
    });

    // 03 정리 프롬프트
    app.appendChild(el('h2', null, '<span class="n">03</span>정리 프롬프트'));
    app.appendChild(el('p', {class:'lead'}, '그 밖에 적어 둘 것을 넣고, 버튼을 누르면 위 기록 전체가 프롬프트로 묶여요. 모루나 미르에게 그대로 붙여 넣으세요.'));
    var ex = el('div', {class:'extra'});
    var exTa = el('textarea', {placeholder:'예: 역할 분담, 다음에 볼 결과물, 시간이 모자라 못 다룬 것, 미팅 실제 시간'});
    bindText(exTa, state, 'extra');
    ex.appendChild(exTa);
    app.appendChild(ex);

    var act = el('div', {class:'actions'});
    var copyBtn = el('button', {class:'btn', type:'button'}, '📋 정리 프롬프트 복사');
    var resetBtn = el('button', {class:'btn ghost', type:'button'}, '이 팀 메모 지우기');
    var toast = el('span', {class:'toast', role:'status'});
    var out = el('textarea', {class:'out', readonly:'', 'aria-label':'정리 프롬프트'}); out.hidden = true;
    copyBtn.addEventListener('click', function(){
      out.value = buildPrompt(); out.hidden = false;
      copy(out.value, toast, function(){ out.focus(); out.select(); });
    });
    resetBtn.addEventListener('click', function(){
      if (!confirm(T.name + ' 메모를 모두 지울까요?')) return;
      delete MEM[current]; try { localStorage.removeItem(PREFIX + current); } catch(e){}
      render(current);
    });
    act.appendChild(copyBtn); act.appendChild(resetBtn); act.appendChild(toast);
    app.appendChild(act);
    app.appendChild(out);

    // 04 다음 일정
    app.appendChild(el('h2', null, '<span class="n">04</span>다음 일정'));
    var nx = el('div', {class:'next'});
    nx.innerHTML = '<div><b>10.29(목) 23:59</b><span>v1 드라이브 업로드<br>' + esc(T.file) + '</span></div>' +
      '<div><b>10.31(토) ~ 11.1(일)</b><span>오프라인 통합 멘토링<br>v1 함께 리뷰</span></div>' +
      '<div><b>' + T.final + '</b><span>본선 · DDP 아트홀</span></div>';
    app.appendChild(nx);
    document.title = '1차 온라인 멘토링 보드 · ' + T.name;
  }

  function buildPrompt(){
    var T = TEAMS[current], L = [];
    var log = current === 'guil' ? '일지/구일고_1회차_1019.md' : '일지/옥종고_1회차_1019.md';
    L.push('아래는 오늘 진행한 2026 C.O.D.E ' + T.name + ' 1차 온라인 멘토링(' + T.time + ') 기록이야. 멘토가 미팅 중에 직접 받아 적은 내용이니, 이 기록을 근거로 정리해줘.');
    L.push('');
    L.push('[정리할 것]');
    L.push('1. 오늘 정해진 것 / 아직 정하지 않은 것');
    L.push('2. 첫 버전 기능 3개와 나중으로 미룰 것 (기록에 근거가 있을 때만)');
    L.push('3. v1(10.29(목) 23:59, ' + T.file + ')까지 학생 역할별 할 일: ' + T.roles.join(' / '));
    L.push('4. 운영사가 할 일 (v0 보완, 자료·예시 준비, 확인할 것)');
    L.push('5. 재단 멘토링 일지 초안: 멘토링 주제 / 멘토링 내용 / 질문 및 고민 / 멘토 피드백 및 조언 / 다음 멘토링까지 할 일 / 다음 일정(10.31~11.1 오프라인 통합 멘토링)');
    L.push('');
    L.push('[규칙]');
    L.push('- 기록에 없는 합의를 지어내지 말고, 기록이 없으면 "미정"으로 둬. 추측은 [추측]으로 따로 표시해.');
    L.push('- 학생·교사 이름은 쓰지 말고 역할명만 써.');
    L.push('- 실제 진행 시간은 기록에 있으면 그대로 쓰고, 없으면 [ ]로 비워 둬.');
    L.push('- 고등학교_온라인_멘토링_작업 폴더의 AGENTS.md와 10_운영마스터플랜_10월-12월.md를 따르고, 결과는 ' + log + '에 저장한 뒤 _작업로그.md에 남겨줘.');
    L.push('');
    L.push('==== 기록 ====');
    L.push('');
    L.push('■ v0 써 본 의견');
    L.push('[기능] ' + ((state.v0.fn || '').trim() || '(기록 없음)'));
    L.push('[UI] ' + ((state.v0.ui || '').trim() || '(기록 없음)'));
    L.push('');
    L.push('■ 사전 질문 항목별');
    T.items.forEach(function(it, i){
      L.push('');
      L.push('[' + it.no + '. ' + it.title + ']');
      L.push('- 사전 답: ' + (it.ans.length ? it.ans.join(' / ') : '(비어 있음)'));
      L.push('- 멘토 피드백(미리 준비): ' + it.fb.join(' '));
      L.push('- 물어본 것: ' + it.ask);
      L.push('- 학생 의견·오늘 정한 것: ' + (((state.m['i' + i]) || '').trim() || '(기록 없음)'));
    });
    L.push('');
    L.push('■ 그 밖의 메모');
    L.push((state.extra || '').trim() || '(기록 없음)');
    return L.join('\n');
  }

  function copy(text, toast, onFail){
    function done(ok){ toast.textContent = ok ? '복사했어요. 모루나 미르에게 붙여 넣으세요.' : '자동 복사가 안 됐어요. 아래 내용을 Ctrl+C로 복사해 주세요.'; if (!ok && onFail) onFail(); setTimeout(function(){ toast.textContent = ''; }, 5000); }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta); done(ok);
    }
  }

  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ render(b.getAttribute('data-t')); }); });
  var h = (location.hash || '').replace('#', '');
  render(TEAMS[h] ? h : (new Date().getHours() >= 18 ? 'okjong' : 'guil'));
})();
</script>
