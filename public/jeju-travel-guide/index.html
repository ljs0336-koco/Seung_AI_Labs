<script type="application/json" id="trip-data">{"days":[{"date":"2026-11-30","weekday":"월","title":"도착해서, 편안하게","lead":"맛있는 점심을 먹고 숙소에서 쉬어요. 산책은 쉬고 나서 결정해요.","sunNote":"첫날의 중심은 점심과 휴식이에요. 바람이 약하고 기운이 남으면 보목포구를 짧게 걸어요.","rainNote":"산책은 빼고 점심 → 체크인·휴식 → 저녁만 편하게 보내요. 소암기념관은 월요일 휴관이에요.","restNote":"보목포구도 생략해도 좋아요. 체크인 전이면 짐을 맡기고 실내에서 쉬어요.","extraText":"보목 대신 노을이 보고 싶으면 구두미포구를 골라도 좋아요.","extras":["bomok","gudumi"],"steps":[{"time":"아침\n도착 후","title":"제주공항 · 렌터카 인수","text":"셔틀과 차량 인수를 마치고 서귀포로 이동해요. 네이버 길찾기에서 큰길 우선 경로도 비교해요.","place":"airport"},{"time":"11:30\n~13:00","meal":"lunch","title":"식사","text":"식사한 뒤 숙소로 가서 충분히 쉬어요.","options":[{"id":"chakhan-galchi","dish":"순살갈치조림 · 가시 부담 적은 첫 끼","why":"보목에서 점심을 먹고 숙소로 향하는 안이에요."},{"id":"negeori","dish":"성게국 · 갈치국","why":"조림보다 따뜻한 국물이 당길 때 골라요. 시내 공영주차장 이용을 생각해요."}]},{"time":"14:00\n이후","title":"체크인 · 충분히 쉬기","text":"점심 이후 일정은 비워두고 쉬어요. 실제 체크인 시간에 맞춰요."},{"time":"16:00쯤\n20분 안팎","title":"보목포구 짧은 산책","text":"포구 안쪽 육지 길에서 5~10분쯤 걸었다 돌아와요. 피곤하면 숙소에 있어도 좋아요.","place":"bomok","optional":true,"outdoor":true},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"쉬고 난 뒤 저녁을 먹어요. 고기가 당기지 않으면 뚝배기로 바꿔요.","options":[{"id":"seogwipo-heukdon","dish":"흑돼지 오겹살 · 목살","why":"고기를 먹고 싶은 저녁의 선택이에요."},{"id":"sambo","dish":"전복뚝배기 · 김치찌개백반","why":"각자 편한 한 끼를 고르기 좋아요."}]}]},{"date":"2026-12-01","weekday":"화","title":"대평 바다, 온실은 선택","lead":"맑으면 대평포구에 잠깐. 오후에는 다시 쉬는 시간이에요.","sunNote":"대평포구와 점심이 기본이에요. 여미지 온실은 더 보고 싶을 때만 들러요.","rainNote":"서쪽 나들이 대신 서귀포 실내·식사로 가까이 머물러요. 비바람이 세면 관람도 생략해요.","restNote":"외출 자체가 부담되면 서귀포에서 한 끼 먹고 쉬어요. 늦은 합류를 기다리며 저녁을 미루지 않아도 돼요.","reminder":"늦은 합류 식사는 포장·간단식을 미리 준비해요. 확인된 심야 1인 식당은 없어요.","extraText":"중문에 나간 날 실내를 더 보고 싶으면 온실이나 전시 하나만 골라요.","extras":["yeomiji","teddy","bomok"],"steps":[{"time":"10:00쯤\n천천히 출발","title":"서쪽으로 가벼운 나들이","text":"급하게 서두르지 말고, 출발 전 바람부터 확인해요."},{"time":"11:00쯤\n20~30분","title":"대평포구 · 바다 바라보기","text":"포구에서 박수기정만 보고 돌아와요. 절벽 위 몰길은 올라가지 않아요.","place":"daepyeong","outdoor":true},{"time":"12:00\n~13:00","meal":"lunch","title":"식사","text":"중문에 들러 따뜻한 한 끼를 먹어요.","options":[{"id":"garam","dish":"전복돌솥밥","why":"중문 나들이의 점심 후보예요."},{"id":"duridumbi","dish":"순두부","why":"전복 대신 부드러운 두부 한 끼가 당길 때 골라요."}]},{"time":"13:30쯤\n30~60분","title":"여미지 온실만 짧게","text":"원할 때 온실 위주로 둘러봐요. 옥외 정원·전망탑은 생략해도 좋아요.","place":"yeomiji","optional":true},{"time":"15:00\n이후","title":"숙소로 돌아와 휴식","text":"밤 합류 전까지 여유 있게 쉬어요."},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"평소 시간에 먼저 먹고, 밤 합류는 도착 시각에 맞춰요.","options":[{"id":"sambo","dish":"김치찌개백반 · 전복뚝배기","why":"서귀포에서 편하게 한 끼 먹어요."},{"id":"negeori","dish":"성게국 · 갈치국","why":"따뜻한 향토 국물이 먹고 싶을 때 골라요."}]}],"rainSteps":[{"time":"10:30쯤\n20~40분","title":"소암기념관 · 짧은 실내 전시","text":"서예 전시에 관심이 있으면 잠깐 둘러봐요. 비바람이 세면 바로 휴식으로 바꿔요.","place":"soam","optional":true},{"time":"12:00\n~13:00","meal":"lunch","title":"식사","text":"서귀포 안에서 편한 메뉴를 먹어요.","options":[{"id":"sambo","dish":"김치찌개백반 · 전복뚝배기","why":"서쪽으로 이동하지 않는 날의 식사예요."},{"id":"jangsu","dish":"찌개 · 황태국 등 밥상","why":"각자 당기는 메뉴와 반찬으로 한 끼 먹어요."}]},{"time":"오후","title":"숙소 휴식","text":"실내 관람까지 무리해서 채울 필요는 없어요."},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"저녁은 먼저 편하게 먹고, 늦은 합류 식사는 따로 챙겨요.","options":[{"id":"negeori","dish":"성게국 · 갈치국","why":"점심과 다른 메뉴로 고를 수 있어요."},{"id":"sambo","dish":"전복뚝배기 · 김치찌개백반","why":"각자 간단히 고를 수 있는 서귀포 식사예요."}]}]},{"date":"2026-12-02","weekday":"수","title":"따뜻한 온천, 든든한 한 끼","lead":"온천과 점심만으로도 충분해요. 바다는 날씨가 허락할 때만.","sunNote":"온천 → 점심 뒤에 사계 바다나 카페를 원하면 하나만 더해요.","rainNote":"실내 온천과 점심만 하고 돌아와요. 노천탕·해안 정차는 생략해요.","restNote":"온천 후 바로 숙소로 돌아가 쉬어도 좋아요. 저녁까지 서쪽에서 기다릴 필요는 없어요.","extraText":"바람이 약하고 걷고 싶을 때만 초입 전망을 보고 돌아와요. 숙소 복귀 후 산책은 보목포구도 좋아요.","extras":["songaksan","one-and-only","bomok"],"steps":[{"time":"09:30\n~10:00","title":"느긋하게 출발","text":"온천에서 서두르지 않도록 오전을 넉넉히 써요."},{"time":"11:00쯤\n1~2시간","title":"산방산 탄산온천","text":"실내 온천에서 편하게 쉬어요. 노천탕은 바람을 보고 선택해요.","place":"sanbang-hot"},{"time":"13:00쯤","meal":"lunch","title":"식사","text":"전날 돌솥밥을 먹었다면 오늘은 죽이나 갈치로 바꿔요.","options":[{"id":"sagye-jeonbok","dish":"전복죽 · 전복뚝배기","why":"온천 뒤 편안한 전복 한 끼예요."},{"id":"seoyeong","dish":"순살 은갈치조림","why":"죽 대신 생선조림이 당길 때 골라요."}]},{"time":"14:30쯤\n짧게","title":"사계 바다 · 차 한잔은 선택","text":"바람이 약하면 해안에 잠깐 머물러요. 춥거나 피곤하면 곧장 복귀해요.","place":"sagye-beach","optional":true,"outdoor":true},{"time":"15:30\n이후","title":"숙소 복귀 · 쉬기","text":"오후 관광은 늘리지 않고 충분히 쉬어요."},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"서쪽에서 돌아오는 길이거나 숙소에서 쉰 뒤에 골라요.","options":[{"id":"moonchibi","dish":"백돼지 근고기","why":"강정 쪽 귀환길의 고기 저녁 대안이에요."},{"id":"sambo","dish":"전복뚝배기 · 김치찌개백반","why":"구이보다 간단한 식사가 당길 때 골라요."}]}]},{"date":"2026-12-03","weekday":"목","title":"맑은 날의 협재 바다","lead":"이번 여행의 바다 나들이. 해변과 점심을 보고 여유 있게 돌아와요.","sunNote":"협재는 맑고 바람 약한 날 최우선이에요. 이날은 다른 먼 권역까지 이어 돌지 않아요.","rainNote":"오늘은 서귀포에서 쉬어요. 금요일이 좋으면 협재를 금요일로 옮기고, 두 날 모두 궂으면 생략해요.","restNote":"출발 전 네이버 길찾기로 이동 부담을 확인해요. 피곤하면 가까운 식사·휴식으로 바꿔도 좋아요.","extraText":"협재에서 따뜻한 차를 마시거나, 일찍 복귀했다면 보목포구를 잠깐 걸어요.","extras":["jorangge","bomok"],"steps":[{"time":"09:30\n~10:00","title":"협재로 출발","text":"이날은 이동이 길어질 수 있어요. 실제 길찾기를 보고 출발을 정해요."},{"time":"11:30쯤\n20~30분","title":"협재해수욕장 · 짧게 바다 보기","text":"주차한 곳에서 편한 구간만 걸어요. 모래사장 산책은 바람이 약할 때만 해요.","place":"hyeopjae","outdoor":true},{"time":"12:30\n~13:30","meal":"lunch","title":"식사","text":"따뜻한 보말 한 그릇으로 쉬어가요. 대기가 부담되면 복귀 후 식사로 바꿔요.","options":[{"id":"hyeopjae-noodles","dish":"보말칼국수","why":"바다를 보고 따뜻한 국수 한 그릇으로 쉬어가요."}]},{"time":"14:00쯤\n30~40분","title":"바다 카페는 원할 때만","text":"따뜻한 실내에 자리가 편하면 쉬어요. 긴 카페투어는 하지 않아요.","place":"jorangge","optional":true},{"time":"15:00쯤","title":"서귀포로 복귀 · 휴식","text":"애월·한림·신창을 이어 도는 일정은 더하지 않아요."},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"숙소 쪽으로 돌아와 편하게 저녁을 먹어요.","options":[{"id":"sambo","dish":"전복뚝배기 · 김치찌개백반","why":"각자 편한 한 끼를 고르기 좋아요."},{"id":"seogwipo-heukdon","dish":"흑돼지 오겹살 · 목살","why":"고기를 먹고 싶은 저녁의 선택이에요."}]}],"rainSteps":[{"time":"오전","title":"느긋하게 쉬기","text":"협재 일정은 금요일 날씨를 보고 옮겨요."},{"time":"12:00쯤","meal":"lunch","title":"식사","text":"먼 이동 대신 서귀포에서 한 끼 먹어요.","options":[{"id":"donghong-baekban","dish":"반찬에 밥 먹는 동네 정식","why":"평일 점심에 소박한 백반을 먹고 쉬어요."},{"id":"negeori","dish":"성게국 · 갈치국","why":"국물이 당기면 백반 대신 골라요."}]},{"time":"오후\n20~40분","title":"원하면 소암기념관","text":"실내 전시가 당기면 짧게 보고, 비바람이 세면 쉬어요.","place":"soam","optional":true},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"저녁도 평소 시간에 편하게 먹어요.","options":[{"id":"sambo","dish":"전복뚝배기 · 김치찌개백반","why":"각자 편한 한 끼를 고르기 좋아요."},{"id":"seogwipo-heukdon","dish":"흑돼지 오겹살 · 목살","why":"고기를 먹고 싶은 저녁의 선택이에요."}]}]},{"date":"2026-12-04","weekday":"금","title":"잘 먹고, 쉬고, 짐도 천천히","lead":"마지막 숙박일은 가볍게 보내요. 협재를 못 갔다면 오늘 날씨를 봐요.","sunNote":"식사·짧은 산책·휴식이 기본이에요. 협재를 오늘로 옮기면 목요일 코스를 쓰되 저녁 짐 정리는 남겨둬요.","rainNote":"산책은 빼고 식사·휴식·짐 정리로 보내요. 원하면 소암기념관만 잠깐 둘러봐도 좋아요.","restNote":"가장 마음 편한 방식으로 쉬어요. 내일 아침에는 식당 경유 없이 공항으로 가요.","extraText":"새연교 대신 노을이 당기면 구두미포구, 가까운 포구가 좋으면 보목을 골라요.","extras":["gudumi","bomok","soam"],"steps":[{"time":"11:30\n~12:30","meal":"lunch","title":"식사","text":"점심은 백반이나 따뜻한 국물 둘 중 하나로 골라요.","options":[{"id":"donghong-baekban","dish":"반찬에 밥 먹는 동네 정식","why":"평일 점심에 소박한 백반을 먹고 쉬어요."},{"id":"negeori","dish":"성게국 · 갈치국","why":"국물이 당기면 백반 대신 골라요."}]},{"time":"13:00\n이후","title":"숙소에서 한숨 쉬기","text":"오후를 빽빽하게 채우지 않아요."},{"time":"15:30쯤\n20~30분","title":"새연교 · 다리만 왕복","text":"새섬 입구에서 돌아와요. 다리 왕복338m 외에 주차장 접근이 더해지고 앞뒤 경사가 있어요.","place":"saeyeongyo","optional":true,"outdoor":true},{"time":"18:00쯤","meal":"dinner","title":"식사","text":"편한 한 끼로 마무리하고, 회가 당기면 선택해요.","options":[{"id":"sambo","dish":"김치찌개백반 · 전복뚝배기","why":"마지막 저녁도 편한 한 끼로 마무리해요."},{"id":"naunteo","dish":"특대방어 4인상 · 4인 160,000원 자료값","why":"회를 먹고 싶은 날의 선택이에요. 가격과 당일 입고를 확인해요."}]},{"time":"저녁 식사 후","title":"짐 정리 · 일찍 쉬기","text":"내일 항공편·반납·셔틀 시간을 마지막으로 확인해요."}]},{"date":"2026-12-05","weekday":"토","title":"가볍게 먹고, 공항으로","lead":"오늘은 관광 없이 반납과 탑승을 편하게 마치는 날이에요.","sunNote":"날씨가 좋아도 추가 관광은 넣지 않아요. 아주 여유가 있을 때 숙소 앞을 잠깐 걷는 정도면 충분해요.","rainNote":"이동·반납·셔틀 여유를 늘리고 항공편 안내를 확인해요.","restNote":"아침은 숙소 간단식이나 반납 후 공항 식사로 골라요. 식당은 따로 들르지 않아요.","e <script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('trip-data').textContent),places=new Map(data.places.map(p=>[p.id,p])),days=data.days,dayContent=document.getElementById('day-content'),sheet=document.getElementById('sheet'),body=document.getElementById('sheet-body');
const categories={all:'전체',food:'식당',indoor:'실내·관광',walk:'산책·전망',cafe:'카페',prep:'여행준비'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?esc(u):'';
const mapurl=p=>p.mapUrl||'https://map.naver.com/p/search/'+encodeURIComponent((p.mapQuery||p.name)+' 제주');
const visitNote=p=>(p.notes||[]).join(' ').split(/(?<=[.!?])\s+/).find(t=>/주차|계단|엘리베이터|입식/.test(t))||'';
const maplink=p=>`<a class="place-link" href="${safe(mapurl(p))}" target="_blank" rel="noopener noreferrer">네이버 지도 ↗</a>`;
let weatherByDay={};let activeDay=0,weather='sun',mode='course',filter='all',limit=12,opener=null,selections={},mapEntries=[],mealReturn=null;
try{selections=JSON.parse(localStorage.getItem('jeju_meals_v4')||'{}')}catch{}if(!selections||typeof selections!=='object'||Array.isArray(selections))selections={};
const tabs=[...document.querySelectorAll('.date')];
function steps(){const d=days[activeDay];return weather==='rain'&&d.rainSteps?d.rainSteps:d.steps.filter(s=>!(weather==='rain'&&s.outdoor));}
function option(s){const key=days[activeDay].date+'_'+weather+'_'+s.meal;return s.options.find(x=>x.id===selections[key])||s.options[0];}
function placeFor(s){return places.get(s.meal?option(s).id:s.place);}
function action(s,i){const p=placeFor(s);return `<div class="step-actions">${s.meal?`<button type="button" class="button soft" data-meal="${i}">${s.meal==='lunch'?'점심 메뉴 추천':'저녁 메뉴 추천'} · ${s.options.length}곳</button>`:''}${p?maplink(p):''}${s.place&&!s.meal?`<button class="textbutton place-link" type="button" data-place="${esc(s.place)}">관람·이용 정보</button>`:''}</div>`;}
function renderDay(){dayContent.setAttribute('role','tabpanel');dayContent.setAttribute('aria-labelledby','date-'+days[activeDay].date);const d=days[activeDay],ss=steps();dayContent.className='';dayContent.innerHTML=`<div class="dayhead"><div><p class="daylabel">${esc(d.date.slice(5).replace('-','/'))} ${esc(d.weekday)}요일 · ${activeDay+1}일차</p><h2>${esc(d.title)}</h2><p class="lead">${esc(d.lead)}</p></div><button class="button map-open" data-map type="button">오늘 동선 · 네이버 지도 ↗</button></div><div class="weather-tabs" role="group" aria-label="오늘 날씨에 맞는 코스"><button class="weather-tab" type="button" data-weather="sun" aria-pressed="${weather==='sun'}">맑고 바람 약한 날</button><button class="weather-tab" type="button" data-weather="rain" aria-pressed="${weather==='rain'}">비·바람 있는 날</button></div><p class="weather-note">${esc(weather==='sun'?d.sunNote:d.rainNote)}</p><p class="timing-note">${activeDay===5?'출발 시각은 항공편에서 역산해요. 아래는 이동 순서예요.':'예시 시간이에요. 도착편·숙소와 식사 속도에 맞춰 조정해요.'}</p><div class="course-grid"><ol class="timeline">${ss.map((s,i)=>{const p=placeFor(s),o=s.meal?option(s):null;return `<li class="step"><div class="when">${esc(s.time)}</div><div class="step-card"><div class="step-title"><h3>${esc(s.meal?(s.meal==='lunch'?'점심 · ':'저녁 · ')+(p?.name||'식사'):s.title)}</h3>${s.optional?'<span class="tag">원할 때만</span>':''}</div>${o?`<p class="dish">${esc(o.dish)}</p>`:''}<p>${esc(s.text)}</p>${action(s,i)}</div></li>`}).join('')}</ol><aside class="side" aria-label="오늘의 선택과 참고"><section class="side-card"><h3>조금 더 여유가 있다면</h3><p>${esc(d.extraText)}</p><ul class="side-list">${d.extras.filter(id=>!ss.some(s=>s.place===id)).map(id=>{const p=places.get(id);return `<li><button type="button" data-place="${esc(id)}">${esc(p.name)} ↗</button></li>`}).join('')}</ul><h3 style="margin-top:18px">쉬고 싶으면</h3><p>${esc(d.restNote)}</p>${d.reminder?`<p>${esc(d.reminder)}</p>`:''}<button class="textbutton" data-reference="all" type="button">다른 식당·명소 더 찾아보기 ↗</button></section></aside></div>`;
tabs.forEach((t,i)=>{t.setAttribute('aria-selected',String(i===activeDay));t.tabIndex=i===activeDay?0:-1});}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2400)}
function openSheet(title,content,trigger){opener=trigger;document.getElementById('sheet-title').textContent=title;body.innerHTML=content;sheet.showModal();sheet.scrollTop=0;}
function closeSheet(){sheet.close();if(opener?.isConnected)opener.focus();}
document.getElementById('sheet-close').addEventListener('click',closeSheet);sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
function mealSheet(i,trigger){mealReturn=i;const s=steps()[i];if(!s?.meal)return;const chosen=option(s);openSheet((s.meal==='lunch'?'점심':'저녁')+' 메뉴 추천',`<p>이 코스에서 먹기 좋은 ${s.options.length>1?'두 가지예요. 지금 끌리는 메뉴로 골라요.':'후보예요. 대기가 부담되면 복귀 후 편하게 먹어도 좋아요.'}</p><div class="meal-grid">${s.options.map((o,j)=>{const p=places.get(o.id);return `<article class="meal-card ${o.id===chosen.id?'selected':''}"><span class="type">${j===0?'먼저 추천':'다른 메뉴로 먹고 싶으면'}</span><h3>${esc(p.name)}</h3><p><strong>${esc(o.dish)}</strong></p><p>${esc(o.why||p.summary)}</p>${p.price?`<p class="price">${esc(p.price)}</p>`:''}<p>${esc(p.hours||'현재 영업시간은 방문 전에 확인해요.')}</p><p>${esc(visitNote(p))}</p><div class="ref-actions">${maplink(p)}<button class="textbutton" type="button" data-place="${esc(p.id)}">자세히</button></div><button class="button ${o.id===chosen.id?'':'primary'}" data-select-meal="${i}" data-choice="${esc(p.id)}" type="button">${o.id===chosen.id?'현재 선택':'이 메뉴로 선택'}</button></article>`}).join('')}</div><p class="inline-note">가격·운영시간은 모아둔 자료 기준이에요. 현재 메뉴·휴무는 방문 전에 확인해요.</p>`,trigger);}
function details(id,trigger){const p=places.get(id);if(!p)return;const fields=[['메뉴·특징',p.menu||p.summary],['가격 참고',p.price],['운영·휴무',p.hours],['위치',p.address],['가기 전에',p.notes?.join(' ')]];const back=sheet.open&&mealReturn!==null;const outer=back?document.querySelector(`[data-meal="${mealReturn}"]`):trigger;if(sheet.open)sheet.close();openSheet(p.name,`${back?'<button class="textbutton" type="button" data-back-meal>← 메뉴 추천으로 돌아가기</button>':''}<p>${esc(categories[p.category]||'참고')} · ${esc(p.area||'제주')}</p><p>${esc(p.summary)}</p><dl class="facts">${fields.filter(x=>x[1]).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><div class="ref-actions">${p.category!=='prep'?maplink(p):''}${p.sourceUrl?`<a href="${safe(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">안내·자료 출처 ↗</a>`:''}</div><p class="inline-note">조사 자료 기준으로 정리했어요. 현장 가격·임시휴무·주차 상태는 방문 전 다시 확인해요.</p>`,outer);}
function updateMapRoute(){const available=mapEntries.filter((x,i)=>x.p?.naverPoint&&(!x.step.optional||document.querySelector(`[data-route-include="${i}"]`)?.checked)).map(x=>x.p);const a=document.getElementById('naver-full-route');if(!a)return;a.hidden=available.length<2;if(available.length>=2){const via=available.slice(1,-1).map(p=>p.naverPoint).join(':')||'-';a.href=`https://map.naver.com/p/directions/${available[0].naverPoint}/${available[available.length-1].naverPoint}/${via}/car?c=10.00,0,0,0,dh`;a.textContent=`${available.length}곳을 한 번에 · 네이버 자동차 동선 ↗`;}document.getElementById('route-count').textContent='선택 장소는 체크를 빼면 경로에서 제외돼요. 숙소 정차 구간은 별도로 추가해요.';}
function mapSheet(trigger){mealReturn=null;mapEntries=steps().map(s=>({step:s,p:placeFor(s)}));openSheet('오늘 동선 · 네이버 지도',`<p>시간 순서대로 관광지와 선택한 식당을 모았어요. 네이버에서 위치와 자동차 동선을 함께 확인해요.</p><a class="button primary" id="naver-full-route" target="_blank" rel="noopener noreferrer">네이버 자동차 동선 ↗</a><p class="timing-note" id="route-count"></p><ol class="maplist">${mapEntries.map((x,i)=>`<li><div><strong><span class="num">${i+1}</span>${esc(x.p?.name||x.step.title)}</strong><small>${esc(x.step.time.replace('\n',' · '))}${x.p&&!x.p.naverPoint?' · 위치는 검색으로 확인':''}</small>${x.step.optional&&x.p?.naverPoint?`<label class="timing-note"><input type="checkbox" data-route-include="${i}" checked> 선택 장소 경로에 포함</label>`:''}</div>${x.p?`<a class="button small" href="${safe(mapurl(x.p))}" target="_blank" rel="noopener noreferrer">위치 ↗</a>`:'<span class="tag">위치 확인 후</span>'}</li>`).join('')}</ol><p class="inline-note">숙소·렌터카 지점은 예약 위치가 정해지면 길찾기에 추가해요. 공항 핀은 렌터카 반납 지점과 달라요. 장소 위치는 개별 지도 버튼으로도 확인할 수 있어요.</p>`,trigger);updateMapRoute();}
function setDay(i,scroll=false){activeDay=i;weather=weatherByDay[days[i].date]||'sun';renderDay();try{history.replaceState(null,'','#day-'+days[i].date)}catch{}if(scroll)document.getElementById('course-view').scrollIntoView({block:'start',behavior:'auto'});}
function setMode(next){mode=next;document.getElementById('course-view').hidden=next!=='course';document.getElementById('reference-view').hidden=next!=='reference';document.getElementById('dates').hidden=next!=='course';document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode===next;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});if(next==='reference'){renderReferences();try{history.replaceState(null,'','#reference')}catch{}}else setDay(activeDay);document.querySelector('main').scrollIntoView({block:'start',behavior:'auto'});}
function renderReferences(){const q=document.getElementById('place-search').value.normalize('NFKC').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);const matches=data.places.filter(p=>!p.supportOnly&&(filter==='all'||p.category===filter)&&q.every(w=>[p.name,p.area,p.summary,p.menu,p.price,p.hours,p.address,...(p.notes||[])].join(' ').normalize('NFKC').toLocaleLowerCase().includes(w)));document.getElementById('result-count').textContent=`${matches.length}곳 · ${q.length?'검색 결과':'관심 있는 곳만 골라보세요.'}`;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));document.getElementById('reference-grid').innerHTML=matches.slice(0,limit).map(p=>`<article class="ref-card"><p class="ref-meta">${esc(categories[p.category])} · ${esc(p.area||'제주')}</p><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p>${p.price?`<p class="price">${esc(p.price)}</p>`:''}<button class="button small" type="button" data-place="${esc(p.id)}">메뉴·이용 정보 보기</button><div class="ref-actions">${p.category!=='prep'?maplink(p):''}</div></article>`).join('')||'<p class="empty">다른 메뉴나 지역 이름으로 찾아봐요.</p>';const more=document.getElementById('show-more');more.hidden=matches.length<=limit;more.textContent=`더 보기 · ${Math.max(0,matches.length-limit)}곳 남음`;}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.mode){setMode(t.dataset.mode);return}if(t.dataset.day!==undefined){setMode('course');setDay(Number(t.dataset.day),true);return}if(t.dataset.weather){weather=t.dataset.weather;weatherByDay[days[activeDay].date]=weather;renderDay();document.querySelector(`[data-weather="${weather}"]`)?.focus();return}if(t.dataset.meal!==undefined){mealSheet(Number(t.dataset.meal),t);return}if(t.dataset.selectMeal!==undefined){const i=Number(t.dataset.selectMeal),s=steps()[i];if(s.options.some(x=>x.id===t.dataset.choice)){selections[days[activeDay].date+'_'+weather+'_'+s.meal]=t.dataset.choice;try{localStorage.setItem('jeju_meals_v4',JSON.stringify(selections))}catch{}closeSheet();renderDay();document.querySelector(`[data-meal="${i}"]`)?.focus();toast('식사와 지도 목록에 반영했어요.')}return}if(t.hasAttribute('data-back-meal')){const i=mealReturn;sheet.close();mealSheet(i,document.querySelector(`[data-meal="${i}"]`));return}if(t.hasAttribute('data-map')){mapSheet(t);return}if(t.dataset.place){if(!sheet.open)mealReturn=null;details(t.dataset.place,t);return}if(t.dataset.reference){filter=t.dataset.reference;limit=12;setMode('reference');return}if(t.dataset.filter){filter=t.dataset.filter;limit=12;renderReferences();return}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-route-include'))updateMapRoute()});tabs.forEach((t,i)=>t.addEventListener('keydown',e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%6;else if(e.key==='ArrowLeft')n=(i+5)%6;else if(e.key==='Home')n=0;else if(e.key==='End')n=5;else return;e.preventDefault();setDay(n);tabs[n].focus()}));
document.querySelectorAll('.mode').forEach(t=>t.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=t.dataset.mode==='course'?'reference':'course';setMode(next);document.querySelector(`[data-mode="${next}"]`).focus()}}));
document.getElementById('place-search').addEventListener('input',()=>{limit=12;renderReferences()});document.getElementById('show-more').addEventListener('click',()=>{limit+=12;renderReferences()});
const font=document.getElementById('font-toggle');let small=false;try{small=localStorage.getItem('jeju_guide_font_v4')==='small'}catch{}function setFont(){document.documentElement.classList.toggle('small',small);font.textContent=small?'글자 크게':'글자 작게';font.setAttribute('aria-label',font.textContent)}setFont();font.addEventListener('click',()=>{small=!small;setFont();try{localStorage.setItem('jeju_guide_font_v4',small?'small':'large')}catch{}});
const initialHash=location.hash;const initial=days.findIndex(d=>'#day-'+d.date===initialHash);setDay(initial<0?0:initial);if(initialHash==='#reference')setMode('reference');window.addEventListener('hashchange',()=>{if(location.hash==='#reference'){setMode('reference');return}const i=days.findIndex(d=>'#day-'+d.date===location.hash);if(i>=0){mode='course';document.getElementById('course-view').hidden=false;document.getElementById('reference-view').hidden=true;document.getElementById('dates').hidden=false;document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode==='course';b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});setDay(i)}});
})();
</script></body></html>
