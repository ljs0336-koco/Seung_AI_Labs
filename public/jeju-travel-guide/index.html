const visitNote=p=>(p.notes||[]).join(' ').split(/(?<=[.!?])\s+/).find(t=>/주차|계단|엘리베이터|입식/.test(t))||'';
const maplink=p=>`<a class="place-link" href="${safe(mapurl(p))}" target="_blank" rel="noopener noreferrer">네이버 지도 ↗</a>`;
let swapped=false;try{swapped=localStorage.getItem('jeju_swap_v7')==='true'}catch{}
let weatherByDay={};let activeDay=0,weather='sun',mode='course',filter='all',limit=12,opener=null,selections={},mapEntries=[],mealReturn=null;
try{selections=JSON.parse(localStorage.getItem('jeju_meals_v7')||'{}')}catch{}if(!selections||typeof selections!=='object'||Array.isArray(selections))selections={};
const tabs=[...document.querySelectorAll('.date')];
function dayPlan(i=activeDay){const source=swapped&&[3,4].includes(i)?days[7-i]:days[i];return {...source,date:days[i].date,weekday:days[i].weekday};}
function stepsFor(i,w){const d=dayPlan(i);return w==='rain'&&d.rainSteps?d.rainSteps:d.steps.filter(s=>!(w==='rain'&&(s.outdoor||s.fairWeatherOnly)));}
function steps(){return stepsFor(activeDay,weather);}
function plannedMeals(){const used=new Set(),result=[];days.forEach((d,i)=>{const w=weatherByDay[d.date]||'sun';stepsFor(i,w).filter(s=>s.meal).forEach(s=>{const key=d.date+'_'+w+'_'+s.meal;const chosen=s.options.find(o=>o.id===selections[key])||s.options.find(o=>!used.has(o.id))||s.options[0];used.add(chosen.id);result.push({day:i,date:d.date,meal:s.meal,choice:chosen});});});return result;}
function option(s){return plannedMeals().find(x=>x.day===activeDay&&x.meal===s.meal)?.choice||s.options[0];}
function alsoPlanned(id,meal){return plannedMeals().filter(x=>x.choice.id===id&&!(x.day===activeDay&&x.meal===meal)).map(x=>x.date.slice(5).replace('-','/')+' '+(x.meal==='lunch'?'점심':'저녁')).join(' · ');}
function overview(){document.querySelector('.overview-grid').innerHTML=days.map((d,i)=>{const p=dayPlan(i);return `<button type="button" data-day="${i}"><strong>${esc(d.date.slice(5).replace('-','/'))} ${esc(d.weekday)}</strong>${esc(p.title)}<small>${esc(p.overview||'')}</small></button>`}).join('');}
function placeFor(s){return places.get(s.meal?option(s).id:s.place);}
function action(s,i){const p=placeFor(s);return `<div class="step-actions">${s.meal?`<button type="button" class="button soft" data-meal="${i}">${s.meal==='lunch'?'점심 메뉴 추천':'저녁 메뉴 추천'} · ${s.options.length}곳</button>`:''}${p?maplink(p):''}${s.place&&!s.meal?`<button class="textbutton place-link" type="button" data-place="${esc(s.place)}">관람·이용 정보</button>`:''}</div>`;}
function renderDay(){dayContent.setAttribute('role','tabpanel');dayContent.setAttribute('aria-labelledby','date-'+days[activeDay].date);const d=dayPlan(),ss=steps();overview();dayContent.className='';dayContent.innerHTML=`<div class="dayhead"><div><p class="daylabel">${esc(d.date.slice(5).replace('-','/'))} ${esc(d.weekday)}요일 · ${activeDay+1}일차</p><h2>${esc(weather==='rain'?d.rainTitle||d.title:d.title)}</h2><p class="lead">${esc(weather==='rain'?d.rainLead||d.lead:d.lead)}</p></div><button class="button map-open" data-map type="button">오늘 동선 · 네이버 지도 ↗</button></div><div class="weather-tabs" role="group" aria-label="오늘 날씨에 맞는 코스"><button class="weather-tab" type="button" data-weather="sun" aria-pressed="${weather==='sun'}">맑고 바람 약한 날</button><button class="weather-tab" type="button" data-weather="rain" aria-pressed="${weather==='rain'}">비·바람 있는 날</button></div><p class="weather-note">${esc(weather==='sun'?d.sunNote:d.rainNote)}</p>${[3,4].includes(activeDay)?`<div class="swap-row"><span>${swapped?'목요일 서귀포 · 금요일 협재':'목요일 협재 · 금요일 서귀포'}</span><button class="button small" type="button" data-swap>${swapped?'원래 목·금 코스로':'목·금 코스 맞바꾸기'}</button></div>`:''}<p class="timing-note">${activeDay===5?'출발 시각은 항공편에서 역산해요. 아래는 이동 순서예요.':'예시 시간이에요. 도착편·숙소와 식사 속도에 맞춰 조정해요.'}</p><div class="course-grid"><ol class="timeline">${ss.map((s,i)=>{const p=placeFor(s),o=s.meal?option(s):null;return `<li class="step"><div class="when">${esc(s.time)}</div><div class="step-card"><div class="step-title"><h3>${esc(s.meal?(s.meal==='lunch'?'점심 · ':'저녁 · ')+(p?.name||'식사'):s.title)}</h3>${s.optional?'<span class="tag">원할 때만</span>':''}</div>${o?`<p class="dish">${esc(o.dish)}</p>`:''}<p>${esc(s.text)}</p>${s.meal&&alsoPlanned(o.id,s.meal)?`<p class="repeat-note">${esc(alsoPlanned(o.id,s.meal))}에도 예정된 식당이에요. 다른 메뉴를 골라도 좋아요.</p>`:''}${action(s,i)}</div></li>`}).join('')}${activeDay===4?'<li class="step"><div class="when">저녁 식사 후</div><div class="step-card"><h3>짐 정리 · 출발 준비</h3><p>내일은 오전 비행이에요. 반납·셔틀 시간까지 확인하고 일찍 쉬어요.</p></div></li>':''}</ol><aside class="side" aria-label="오늘의 선택과 참고"><section class="side-card"><h3>조금 더 여유가 있다면</h3><p>${esc(weather==='rain'?(d.rainExtraText||'비바람이 계속되면 추가 야외 코스는 쉬어요. 관람도 부담되면 따뜻한 차와 숙소 휴식으로 바꿔요.'):d.extraText)}</p><ul class="side-list">${(weather==='rain'?d.rainExtras||[]:d.extras).filter(id=>!ss.some(s=>s.place===id)).map(id=>{const p=places.get(id);return `<li><button type="button" data-place="${esc(id)}">${esc(p.name)} ↗</button></li>`}).join('')}</ul><h3 style="margin-top:18px">쉬고 싶으면</h3><p>${esc(d.restNote)}</p>${d.reminder?`<p>${esc(d.reminder)}</p>`:''}<button class="textbutton" data-reference="all" type="button">다른 식당·명소 더 찾아보기 ↗</button></section></aside></div>`;
tabs.forEach((t,i)=>{t.setAttribute('aria-selected',String(i===activeDay));t.tabIndex=i===activeDay?0:-1});}
function toast(message){const t=document.getElementById('toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2400)}
function openSheet(title,content,trigger){opener=trigger;document.getElementById('sheet-title').textContent=title;body.innerHTML=content;sheet.showModal();sheet.scrollTop=0;}
function closeSheet(){sheet.close();if(opener?.isConnected)opener.focus();}
document.getElementById('sheet-close').addEventListener('click',closeSheet);sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
function mealSheet(i,trigger){mealReturn=i;const s=steps()[i];if(!s?.meal)return;const chosen=option(s);openSheet((s.meal==='lunch'?'점심':'저녁')+' 메뉴 추천',`<p>${s.options.length}곳 중 한 곳을 골라요. 다른 끼니에 예정된 식당은 표시했어요.</p><div class="meal-grid">${s.options.map((o,j)=>{const p=places.get(o.id);return `<article class="meal-card ${o.id===chosen.id?'selected':''}"><span class="type">${j+1} · ${o.id===chosen.id?'현재 코스':'다른 선택'}</span><h3>${esc(p.name)}</h3><p><strong>${esc(o.dish)}</strong></p><p>${esc(o.why||p.summary)}</p>${alsoPlanned(o.id,s.meal)?`<p class="repeat-note">${esc(alsoPlanned(o.id,s.meal))}에도 예정</p>`:''}${p.price?`<p class="price">${esc(p.price)}</p>`:''}<div class="ref-actions">${maplink(p)}<button class="textbutton" type="button" data-place="${esc(p.id)}">영업·주차 정보</button></div><button class="button ${o.id===chosen.id?'':'primary'}" data-select-meal="${i}" data-choice="${esc(p.id)}" type="button">${o.id===chosen.id?'현재 선택':'이 메뉴로 선택'}</button></article>`}).join('')}</div><p class="inline-note">가격·운영시간은 모아둔 자료 기준이에요. 현재 메뉴·휴무는 방문 전에 확인해요.</p>`,trigger);}
function details(id,trigger){const p=places.get(id);if(!p)return;const fields=[['메뉴·특징',p.menu||p.summary],['가격 참고',p.price],['운영·휴무',p.hours],['위치',p.address],['가기 전에',p.notes?.join(' ')]];const back=sheet.open&&mealReturn!==null;const outer=back?document.querySelector(`[data-meal="${mealReturn}"]`):trigger;if(sheet.open)sheet.close();openSheet(p.name,`${back?'<button class="textbutton" type="button" data-back-meal>← 메뉴 추천으로 돌아가기</button>':''}<p>${esc(categories[p.category]||'참고')} · ${esc(p.area||'제주')}</p><p>${esc(p.summary)}</p><dl class="facts">${fields.filter(x=>x[1]).map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><div class="ref-actions">${p.category!=='prep'?maplink(p):''}${p.sourceUrl?`<a href="${safe(p.sourceUrl)}" target="_blank" rel="noopener noreferrer">안내·자료 출처 ↗</a>`:''}</div><p class="inline-note">조사 자료 기준으로 정리했어요. 현장 가격·임시휴무·주차 상태는 방문 전 다시 확인해요.</p>`,outer);}
function updateMapRoute(){const available=mapEntries.filter((x,i)=>x.p?.naverPoint&&(!x.step.optional||document.querySelector(`[data-route-include="${i}"]`)?.checked)).map(x=>x.p);const a=document.getElementById('naver-full-route');if(!a)return;a.hidden=available.length<2;if(available.length>=2){const via=available.slice(1,-1).map(p=>p.naverPoint).join(':')||'-';a.href=`https://map.naver.com/p/directions/${available[0].naverPoint}/${available[available.length-1].naverPoint}/${via}/car?c=10.00,0,0,0,dh`;a.textContent=`${available.length}곳을 한 번에 · 네이버 자동차 동선 ↗`;}document.getElementById('route-count').textContent='선택 장소는 체크를 빼면 경로에서 제외돼요. 숙소 정차 구간은 별도로 추가해요.';}
function mapSheet(trigger){mealReturn=null;mapEntries=steps().map(s=>({step:s,p:placeFor(s)}));openSheet('오늘 동선 · 네이버 지도',`<p>시간 순서대로 관광지와 선택한 식당을 모았어요. 네이버에서 위치와 자동차 동선을 함께 확인해요.</p><a class="button primary" id="naver-full-route" target="_blank" rel="noopener noreferrer">네이버 자동차 동선 ↗</a><p class="timing-note" id="route-count"></p><ol class="maplist">${mapEntries.map((x,i)=>`<li><div><strong><span class="num">${i+1}</span>${esc(x.p?.name||x.step.title)}</strong><small>${esc(x.step.time.replace('\n',' · '))}${x.p&&!x.p.naverPoint?' · 위치는 검색으로 확인':''}</small>${x.step.optional&&x.p?.naverPoint?`<label class="timing-note"><input type="checkbox" data-route-include="${i}" checked> 선택 장소 경로에 포함</label>`:''}</div>${x.p?`<a class="button small" href="${safe(mapurl(x.p))}" target="_blank" rel="noopener noreferrer">위치 ↗</a>`:'<span class="tag">위치 확인 후</span>'}</li>`).join('')}</ol><p class="inline-note">숙소·렌터카 지점은 예약 위치가 정해지면 길찾기에 추가해요. 공항 핀은 렌터카 반납 지점과 달라요. 장소 위치는 개별 지도 버튼으로도 확인할 수 있어요.</p>`,trigger);updateMapRoute();}
function setDay(i,scroll=false){activeDay=i;weather=weatherByDay[days[i].date]||'sun';renderDay();try{history.replaceState(null,'','#day-'+days[i].date)}catch{}if(scroll)document.getElementById('course-view').scrollIntoView({block:'start',behavior:'auto'});}
function setMode(next){mode=next;document.getElementById('course-view').hidden=next!=='course';document.getElementById('reference-view').hidden=next!=='reference';document.getElementById('dates').hidden=next!=='course';document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode===next;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});if(next==='reference'){renderReferences();try{history.replaceState(null,'','#reference')}catch{}}else setDay(activeDay);document.querySelector('main').scrollIntoView({block:'start',behavior:'auto'});}
function renderReferences(){const q=document.getElementById('place-search').value.normalize('NFKC').trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);const matches=data.places.filter(p=>!p.supportOnly&&(filter==='all'||p.category===filter)&&q.every(w=>[p.name,p.area,p.summary,p.menu,p.price,p.hours,p.address,...(p.notes||[])].join(' ').normalize('NFKC').toLocaleLowerCase().includes(w)));document.getElementById('result-count').textContent=`${matches.length}곳 · ${q.length?'검색 결과':'관심 있는 곳만 골라보세요.'}`;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));document.getElementById('reference-grid').innerHTML=matches.slice(0,limit).map(p=>`<article class="ref-card"><p class="ref-meta">${esc(categories[p.category])} · ${esc(p.area||'제주')}</p><h3>${esc(p.name)}</h3><p>${esc(p.summary)}</p>${p.unavailable?'<p class="repeat-note">여행 코스 제외 · 운영 재개 확인 필요</p>':''}${p.price?`<p class="price">${esc(p.price)}</p>`:''}<button class="button small" type="button" data-place="${esc(p.id)}">메뉴·이용 정보 보기</button><div class="ref-actions">${p.category!=='prep'?maplink(p):''}</div></article>`).join('')||'<p class="empty">다른 메뉴나 지역 이름으로 찾아봐요.</p>';const more=document.getElementById('show-more');more.hidden=matches.length<=limit;more.textContent=`더 보기 · ${Math.max(0,matches.length-limit)}곳 남음`;}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.mode){setMode(t.dataset.mode);return}if(t.hasAttribute('data-swap')){swapped=!swapped;try{localStorage.setItem('jeju_swap_v7',String(swapped))}catch{}renderDay();document.querySelector('[data-swap]')?.focus();toast('목요일과 금요일 코스를 함께 바꿨어요.');return}if(t.dataset.day!==undefined){setMode('course');setDay(Number(t.dataset.day),true);return}if(t.dataset.weather){weather=t.dataset.weather;weatherByDay[days[activeDay].date]=weather;renderDay();document.querySelector(`[data-weather="${weather}"]`)?.focus();return}if(t.dataset.meal!==undefined){mealSheet(Number(t.dataset.meal),t);return}if(t.dataset.selectMeal!==undefined){const i=Number(t.dataset.selectMeal),s=steps()[i];if(s.options.some(x=>x.id===t.dataset.choice)){selections[days[activeDay].date+'_'+weather+'_'+s.meal]=t.dataset.choice;try{localStorage.setItem('jeju_meals_v7',JSON.stringify(selections))}catch{}closeSheet();renderDay();document.querySelector(`[data-meal="${i}"]`)?.focus();toast('식사와 지도 목록에 반영했어요.')}return}if(t.hasAttribute('data-back-meal')){const i=mealReturn;sheet.close();mealSheet(i,document.querySelector(`[data-meal="${i}"]`));return}if(t.hasAttribute('data-map')){mapSheet(t);return}if(t.dataset.place){if(!sheet.open)mealReturn=null;details(t.dataset.place,t);return}if(t.dataset.reference){filter=t.dataset.reference;limit=12;setMode('reference');return}if(t.dataset.filter){filter=t.dataset.filter;limit=12;renderReferences();return}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-route-include'))updateMapRoute()});tabs.forEach((t,i)=>t.addEventListener('keydown',e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%6;else if(e.key==='ArrowLeft')n=(i+5)%6;else if(e.key==='Home')n=0;else if(e.key==='End')n=5;else return;e.preventDefault();setDay(n);tabs[n].focus()}));
document.querySelectorAll('.mode').forEach(t=>t.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=t.dataset.mode==='course'?'reference':'course';setMode(next);document.querySelector(`[data-mode="${next}"]`).focus()}}));
document.getElementById('place-search').addEventListener('input',()=>{limit=12;renderReferences()});document.getElementById('show-more').addEventListener('click',()=>{limit+=12;renderReferences()});
const font=document.getElementById('font-toggle');let small=false;try{small=localStorage.getItem('jeju_guide_font_v4')==='small'}catch{}function setFont(){document.documentElement.classList.toggle('small',small);font.textContent=small?'글자 크게':'글자 작게';font.setAttribute('aria-label',font.textContent)}setFont();font.addEventListener('click',()=>{small=!small;setFont();try{localStorage.setItem('jeju_guide_font_v4',small?'small':'large')}catch{}});
const initialHash=location.hash;const initial=days.findIndex(d=>'#day-'+d.date===initialHash);setDay(initial<0?0:initial);if(initialHash==='#reference')setMode('reference');window.addEventListener('hashchange',()=>{if(location.hash==='#reference'){setMode('reference');return}const i=days.findIndex(d=>'#day-'+d.date===location.hash);if(i>=0){mode='course';document.getElementById('course-view').hidden=false;document.getElementById('reference-view').hidden=true;document.getElementById('dates').hidden=false;document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode==='course';b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1});setDay(i)}});
})();
</script></body></html>
