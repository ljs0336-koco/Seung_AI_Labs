<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>돈구리 — 오늘 써도 되는 만큼</title>
  <meta name="description" content="목표에서 거꾸로 계산해 오늘 써도 되는 돈을 알려 주는 게임형 경제 학습 앱 (2026 CODE 구일고 0.91 프로토타입)">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ✏️ EDIT 가능: 화면 뼈대. 실제 내용은 app.js 가 그립니다. -->
  <div class="device">
    <div class="app" id="app">
      <header class="topbar" id="topbar"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
      <div class="sheet-wrap" id="sheet" hidden></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- 순서 중요: 규칙 → 콘텐츠 → 캐릭터 → 엔진 -->
  <script src="data/config.js"></script>
  <script src="data/content.js"></script>
  <script src="assets/character.js"></script>
  <script src="app.js"></script>
</body>
</html>
