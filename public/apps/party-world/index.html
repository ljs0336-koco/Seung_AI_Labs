case 'mediaPoint':mediaScore(Number(v));break;case 'mediaPass':mediaScore(null);break;
case 'duration':Game.action('duration',Number(v));break;case 'won':Game.action('win',Number(v));break;
case 'ties':dialog('공동 승리 판정',`<p class="muted spaced">승리한 쪽을 모두 선택하세요. 전원을 선택하면 무승부예요.</p>${Game.state().groups.map((g,i)=>`<label class="prefrow">${esc(g.join(' · '))}<input type="checkbox" value="${i}" data-tie checked></label>`).join('')}<div class="spaced">${bt('결과 확정','confirmTies','','primary')}</div>`);break;
case 'confirmTies':{const picks=[...body.querySelectorAll('input[data-tie]:checked')].map(e=>Number(e.value));if(!picks.length){notify('한 쪽 이상 선택해 주세요.');return}closeModal();Game.action('tie',picks);break}
case 'rules':{const g=curr();dialog(g.title,`<ol class="rule-list">${g.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol><div class="rulebox">${esc(g.win)}</div>`);break}
case 'manualPlus':case 'manualMinus':{const st=stat();st.manualScores[Number(v)]=Math.max(0,st.manualScores[Number(v)]+(a==='manualPlus'?1:-1));save();renderArena(Game.state());break}
case 'manualFinish':{const sc=stat().manualScores;const mx=Math.max(...sc);Game.action('tie',sc.flatMap((n,i)=>n===mx?[i]:[]));break}
case 'manualClock':manualClock(Number(v));break;case 'correct':case 'pass':case 'yes':case 'no':case 'next':Game.action(a);break;
case 'nextDraw':leave();if(eligible().length)roll();break;case 'leave':leave();break;case 'abandon':dialog('라운드를 나갈까요?',`<p class="muted spaced">진행 중인 판은 전적에 기록되지 않습니다.</p><div class="controls spaced">${bt('계속하기','close','','primary')}${bt('월드로','confirmLeave')}</div>`);break;case 'confirmLeave':closeModal();leave();break;
case 'close':closeModal();show();break;case 'prefs':case 'prepare':prefs();break;
case 'toggle':hub.off=hub.off.includes(v)?hub.off.filter(x=>x!==v):[...hub.off,v];save();show();break;
case 'names':rosterDraft=[...hub.names];roster();break;case 'more':case 'less':rosterDraft=readDraft();if(a==='more')rosterDraft.push('플레이어 '+(rosterDraft.length+1));else rosterDraft.pop();roster();break;
case 'saveNames':{const ns=readDraft();if(ns.some(n=>!n)||new Set(ns).size!==ns.length){notify('서로 다른 참가자 이름을 모두 입력해 주세요.');return}hub.names=ns;save();closeModal();show();break}
case 'musicSource':PartyMedia.useMusicSource(v);break;case 'upload':PartyMedia.openPicker(v);break;case 'history':history();break;case 'resetAsk':dialog('전적을 초기화할까요?',`<p class="muted spaced">누적 승수와 라운드 기록이 지워집니다.</p><div class="controls spaced">${bt('취소','close')}${bt('초기화','reset','','danger')}</div>`);break;
case 'reset':hub.history=[];hub.past=[];save();closeModal();show();break}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='category'){Game.action('category',el.value);return}const type=el.dataset.check;if(!type)return;const k=el.value;if(type==='format'){if(!el.checked&&hub.formats.length===1){el.checked=true;notify('대진은 하나 이상 선택해 주세요.');return}hub.formats=el.checked?[...new Set([...hub.formats,k])]:hub.formats.filter(x=>x!==k)}else if(type==='gear')hub.gear[k]=el.checked;else if(type==='game')hub.off=el.checked?hub.off.filter(x=>x!==k):[...new Set([...hub.off,k])];save();show()});
document.getElementById('brand').onclick=()=>{if(page==='rolling')return;if(hub.current&&page!=='world'){if(Game.state().phase==='result'){leave();return}document.querySelector('[data-action=abandon]')?.click();return}page='world';show();top()};
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('이 브라우저에서는 전체화면을 사용할 수 없어요.')}};
document.getElementById('sound').onclick=()=>{hub.sound=!hub.sound;save();syncSound();beep()};
modal.addEventListener('close',()=>{prefsPage=null});window.onPartyMediaChanged=()=>{if(modal.open&&prefsPage==='prefs')prefs();if(page==='world'||page==='preview'||(page==='arena'&&curr()?.media))show()};
window.renderGame=vm=>{if(page==='arena')renderArena(vm)};syncSound();show();
})();
</script>
</body></html>
