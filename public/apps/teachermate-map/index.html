<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>TeacherMate 업무 지도 · 예시초등학교(가상)</title>
  <meta name="description" content="로그인·서버 연결 없이 업무 지도 흐름을 확인하는 TeacherMate 공공 업무 대장형 개선 시연 화면입니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%231e4e8c'/%3E%3Cpath d='M6 8h12M6 12h8M6 16h12' stroke='%23fff' stroke-width='2' stroke-linecap='square'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">업무 목록 바로가기</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-bar">
          <span class="brand-name">TeacherMate</span>
          <span class="brand-sep" aria-hidden="true">|</span>
          <span id="school-label" class="brand-school">예시초등학교(가상) 2026학년도</span>
        </div>

        <div class="topbar-actions">
          <span class="demo-label hide-xs" title="로그인과 서버 연결 없이 가상 예시 데이터로 동작하는 시연 화면입니다.">가상 시연 데이터</span>
          <button type="button" class="topbar-btn" data-scope-trigger="settings">설정</button>
        </div>
      </div>
    </header>

    <nav class="subnav" aria-label="주 메뉴">
      <div class="subnav-inner">
        <button type="button" class="nav-tab is-active" aria-current="page">업무 지도</button>
        <button type="button" class="nav-tab" data-scope-trigger="upload">자료 올리기</button>
        <button type="button" class="nav-tab" data-scope-trigger="handover">인수인계</button>
        <button type="button" class="nav-tab" data-scope-trigger="chat">업무 질문</button>
      </div>
    </nav>

    <div class="page-wrap">
      <div class="page-header">
        <div class="page-header-copy">
          <h1 class="page-title">업무 지도</h1>
          <p class="page-desc">월별 학교 업무 대장 및 부서 수합 현황 (가상 예시)</p>
        </div>
        <button type="button" class="btn btn-primary" data-scope-trigger="upload">자료 올리기</button>
      </div>

      <div class="month-strip-wrap">
        <div id="month-strip" class="month-strip" role="navigation" aria-label="월 선택"></div>
      </div>

      <section class="filter-toolbar" aria-label="업무 필터">
        <div class="filter-row">
          <div class="role-picker-anchor">
            <button type="button" id="role-picker-btn" class="filter-trigger" aria-expanded="false" aria-controls="role-popover">
              <span class="filter-label-muted">담당</span>
              <span id="role-picker-value" class="filter-value">전체 업무</span>
              <span class="caret" aria-hidden="true">▾</span>
            </button>

            <div id="role-popover" class="role-popover" hidden role="dialog" aria-label="담당 업무분장 선택">
              <div class="role-popover-head">
                <strong>담당 업무분장 선택</strong>
                <span class="hint-inline">별표(☆)로 내 담당 지정</span>
              </div>
              <div id="role-popover-body" class="role-popover-body"></div>
            </div>
          </div>

          <button type="button" id="clear-role-btn" class="btn btn-outline btn-sm" hidden>담당 해제 ×</button>

          <button type="button" id="my-duties-btn" class="filter-toggle-btn" aria-pressed="false">
            <span>내 담당</span>
            <span id="my-duties-count" class="count-tag">0</span>
          </button>

          <div class="category-group" role="group" aria-label="업무 구분">
            <button type="button" class="cat-btn is-active" data-cat="all">전체</button>
            <button type="button" class="cat-btn" data-cat="draft">기안</button>
            <button type="button" class="cat-btn" data-cat="collect">수합</button>
            <button type="button" class="cat-btn" data-cat="task">상시</button>
          </div>

          <div class="search-wrap">
            <input id="search-input" type="search" placeholder="업무명·담당 검색" aria-label="업무명 및 담당 검색">
          </div>

          <button type="button" id="reset-demo-btn" class="btn btn-text btn-sm" title="필터와 시연 상태를 처음 상태로 되돌립니다">초기화</button>
        </div>

        <div id="active-filter-summary" class="active-filter-summary" hidden></div>
      </section>

      <section id="mobile-collections-box" class="mobile-collections-box" aria-label="수합 현황"></section>

      <div class="workspace-grid">
        <main id="main-content" class="ledger-column" tabindex="-1">
          <div class="section-head ledger-head">
            <div class="section-head-copy">
              <h2 id="ledger-title" class="section-title">11월 전체 업무</h2>
              <p id="ledger-summary" class="ledger-summary"></p>
            </div>
            <button type="button" id="toggle-events-btn" class="btn btn-outline btn-sm" aria-expanded="false">
              학사 일정 (<span id="events-count">0</span>)
            </button>
          </div>

          <div id="events-drawer-strip" class="events-strip" hidden></div>

          <div id="task-ledger" class="task-ledger"></div>
        </main>

        <aside class="rail-column" aria-label="수합 현황 및 마감 일정">
          <section id="rail-collections-card" class="rail-card">
            <div class="section-head rail-head">
              <h2 class="section-title">수합 현황</h2>
              <span class="meta-label">학교 공통</span>
            </div>
            <ul id="desktop-collections-list" class="collection-list"></ul>
          </section>

          <section class="rail-card">
            <div class="section-head rail-head">
              <h2 class="section-title">마감 일정</h2>
              <span class="meta-label">확정 기준</span>
            </div>
            <div id="upcoming-list" class="upcoming-wrap"></div>

            <div class="ics-box">
              <label class="ics-scope-check">
                <input type="checkbox" id="ics-my-only">
                <span>내 담당 지정 업무만 포함</span>
              </label>
              <button type="button" id="export-ics-btn" class="btn btn-outline btn-full">일정 내보내기 (.ics)</button>
              <p class="ics-hint">확정 일정 기준 · D-7, D-1 알림 포함</p>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <footer class="app-footer">
      <span>TeacherMate 업무 지도 개선 시연 · 모든 학교·인물·일정은 가상의 예시입니다.</span>
    </footer>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="detail-drawer" class="detail-drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div id="drawer-content" class="drawer-inner"></div>
  </aside>

  <div id="scope-modal-backdrop" class="modal-backdrop" hidden>
    <div id="scope-modal" class="scope-modal" role="dialog" aria-modal="true" aria-labelledby="scope-modal-title">
      <div class="scope-modal-head">
        <h2 id="scope-modal-title"></h2>
        <button type="button" id="scope-modal-close" class="btn btn-outline btn-sm" aria-label="안내 닫기">닫기</button>
      </div>
      <div id="scope-modal-body" class="scope-modal-body"></div>
      <div class="scope-modal-foot">
        <button type="button" id="scope-modal-return" class="btn btn-primary btn-sm">업무 지도로 돌아가기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
