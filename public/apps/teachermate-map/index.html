<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>TeacherMate 업무 워크스페이스 · 예시초등학교(가상)</title>
  <meta name="description" content="로그인·서버 연결 없이 업무 지도(목록·캘린더), 자료 올리기(원문 대조), 인수인계, 업무 질문, 설정 전 화면을 체험하는 TeacherMate 예시 앱입니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231b56b5'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 8.8' fill='none' stroke='%23fff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./tm-local-handover.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-bar">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="17" rx="2"></rect>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
              <path d="M9 15l2 2 4-4"></path>
            </svg>
          </span>
          <span class="brand-name">TeacherMate</span>
          <span class="brand-sep" aria-hidden="true">|</span>
          <span id="school-label" class="brand-school">예시초등학교(가상) · 2026학년도</span>
        </div>

        <div class="topbar-actions">
          <span class="demo-chip hide-xs" title="로그인과 서버 연결 없이 이 브라우저에서 가상 자료로 동작합니다.">가상 학교 자료</span>
          <button type="button" class="topbar-btn topbar-btn-accent" data-go-tab="upload">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>자료 올리기</span>
          </button>
          <button type="button" class="topbar-btn" id="topbar-settings-btn" data-go-tab="settings" aria-label="환경설정 및 내 담당 관리">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="hide-xs">설정</span>
          </button>
        </div>
      </div>
    </header>

    <nav class="subnav" aria-label="주 메뉴">
      <div class="subnav-inner">
        <button type="button" class="nav-tab is-active" data-go-tab="map" aria-current="page">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="16" y1="2" x2="16" y2="6"></line>
          </svg>
          <span>업무 지도</span>
          <span id="nav-draft-badge" class="nav-badge" hidden>0</span>
        </button>
        <button type="button" class="nav-tab" data-go-tab="upload">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>자료 올리기</span>
        </button>
        <button type="button" class="nav-tab" data-go-tab="handover">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>인수인계</span>
          <span id="nav-handover-badge" class="nav-badge is-neutral">6</span>
        </button>
        <button type="button" class="nav-tab" data-go-tab="chat">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>업무 질문</span>
        </button>
      </div>
    </nav>

    <div class="page-wrap">
      <!-- 1. 업무 지도 (목록 대장 + 월간 캘린더) -->
      <section id="view-map" class="workspace-view" aria-label="업무 지도">
        <div class="page-header">
          <div class="page-header-copy">
            <h1 class="page-title">업무 지도</h1>
            <p class="page-desc">월별 업무 대장, 학사 캘린더 및 전교 수합 현황 (가상 예시)</p>
          </div>
          <div class="page-header-actions">
            <div class="view-switcher" role="group" aria-label="보기 방식 선택">
              <button type="button" class="switcher-btn is-active" data-map-view="list" aria-pressed="true">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span>목록 대장</span>
              </button>
              <button type="button" class="switcher-btn" data-map-view="calendar" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>월간 캘린더</span>
              </button>
            </div>
            <button type="button" class="btn btn-primary btn-sm hide-xs" data-go-tab="upload">+ 자료 올리기</button>
          </div>
        </div>

        <div class="month-strip-wrap">
          <div id="month-strip" class="month-strip" role="navigation" aria-label="월 선택"></div>
        </div>

        <section class="filter-toolbar" aria-label="업무 필터">
          <div class="filter-row">
            <div class="role-picker-anchor">
              <button type="button" id="role-picker-btn" class="filter-trigger" aria-expanded="false" aria-controls="role-popover">
                <span class="filter-label-muted">담당</span>
                <span id="role-picker-value" class="filter-value">전체 업무</span>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>

              <div id="role-popover" class="role-popover" hidden role="dialog" aria-label="담당 업무분장 선택">
                <div class="role-popover-head">
                  <strong>담당 업무분장 선택</strong>
                  <span class="hint-inline">별표(☆)로 내 담당 지정</span>
                </div>
                <div id="role-popover-body" class="role-popover-body"></div>
              </div>
            </div>

            <button type="button" id="clear-role-btn" class="btn btn-outline btn-sm" hidden>담당 해제 ×</button>

            <button type="button" id="my-duties-btn" class="filter-toggle-btn" aria-pressed="false">
              <span>내 담당</span>
              <span id="my-duties-count" class="count-tag">0</span>
            </button>

            <div class="category-group" role="group" aria-label="업무 구분">
              <button type="button" class="cat-btn is-active" data-cat="all">전체</button>
              <button type="button" class="cat-btn" data-cat="collect"><span class="cat-dot is-collect" aria-hidden="true"></span>수합</button>
              <button type="button" class="cat-btn" data-cat="draft"><span class="cat-dot is-draft-cat" aria-hidden="true"></span>기안</button>
              <button type="button" class="cat-btn" data-cat="task"><span class="cat-dot is-task" aria-hidden="true"></span>상시</button>
            </div>

            <div class="search-wrap">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="search-input" type="search" placeholder="업무명·담당 검색" aria-label="업무명 및 담당 검색">
            </div>

            <button type="button" id="reset-demo-btn" class="btn btn-text btn-sm" title="저장한 업무와 설정을 처음 가상 자료로 되돌립니다">자료 초기화</button>
          </div>

          <div id="active-filter-summary" class="active-filter-summary" hidden></div>
        </section>

        <section id="mobile-collections-box" class="mobile-collections-box" aria-label="수합 현황"></section>

        <div class="workspace-grid">
          <main id="main-content" class="ledger-column" tabindex="-1">
            <div class="section-head ledger-head">
              <div class="section-head-copy">
                <h2 id="ledger-title" class="section-title">11월 전체 업무</h2>
                <p id="ledger-summary" class="ledger-summary"></p>
              </div>
              <button type="button" id="toggle-events-btn" class="btn btn-outline btn-sm" aria-expanded="false">
                <span class="cat-dot is-event" aria-hidden="true"></span>
                <span>학사 일정 (<span id="events-count">0</span>)</span>
              </button>
            </div>

            <div id="events-drawer-strip" class="events-strip" hidden></div>

            <div id="task-ledger" class="task-ledger"></div>
          </main>

          <aside class="rail-column" aria-label="수합 현황 및 마감 일정">
            <section id="rail-collections-card" class="rail-card">
              <div class="section-head rail-head">
                <h2 class="section-title">수합 현황</h2>
                <span class="meta-chip">학교 공통</span>
              </div>
              <ul id="desktop-collections-list" class="collection-list"></ul>
            </section>

            <section class="rail-card">
              <div class="section-head rail-head">
                <h2 class="section-title">마감 일정</h2>
                <span class="meta-chip">확정 기준</span>
              </div>
              <div id="upcoming-list" class="upcoming-wrap"></div>

              <div class="ics-box">
                <label class="ics-scope-check">
                  <input type="checkbox" id="ics-my-only">
                  <span>내 담당 지정 업무만 포함</span>
                </label>
                <button type="button" id="export-ics-btn" class="btn btn-outline btn-full">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>캘린더 일정 내려받기 (.ics)</span>
                </button>
                <p class="ics-hint">확정 일정 기준 · D-7, D-1 알림 포함</p>
              </div>
            </section>
          </aside>
        </div>
      </section>

      <!-- 2. 자료 올리기 (통합 입력 + 좌 원문 ↔ 우 초안 대조 검수함) -->
      <section id="view-upload" class="workspace-view" hidden aria-label="자료 올리기"></section>

      <!-- 3. 인수인계 노트 (부서별 타임라인 · 요령 · 전임자 Q&A) -->
      <section id="view-handover" class="workspace-view" hidden aria-label="인수인계"></section>

      <!-- 4. 업무 질문 (문서 근거 · 가드레일 · 전임자 연결) -->
      <section id="view-chat" class="workspace-view" hidden aria-label="업무 질문"></section>

      <!-- 5. 설정 -->
      <section id="view-settings" class="workspace-view" hidden aria-label="설정"></section>

    </div>

    <footer class="app-footer">
      <span>TeacherMate · 모든 학교·인물·문서·일정은 가상의 예시입니다.</span>
    </footer>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="detail-drawer" class="detail-drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div id="drawer-content" class="drawer-inner"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
