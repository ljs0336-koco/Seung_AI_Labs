<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>STUDY-BUDDY — 내가 가르치며 자라는 AI 학습 버디</title>
