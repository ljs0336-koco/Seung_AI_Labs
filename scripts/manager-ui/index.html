<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자료 편집 · 나만의 기지</title><link rel="stylesheet" href="./style.css"></head>
<body><header><a href="/#/base" class="brand">S <span>나만의 기지</span></a><span class="sub">자료 편집</span><a href="/#/base">기지 보기 ↗</a></header>
<main><div class="heading"><div><p class="eyebrow">SEUNG AI LABS</p><h1>꺼내 쓰고, 나누고.</h1><p>자료를 등록하고 포털에 보일 위치를 고르세요.</p></div><button id="add" class="primary">+ 자료 추가</button></div>
<section class="status" aria-label="저장과 반영 상태"><div><strong id="saved">자료를 읽는 중</strong><span id="deployed"></span></div><div class="actions"><button id="save">변경 저장</button><button id="prepare">미리보기 만들기</button><button id="publish" class="primary">웹에 반영</button></div></section>
<p id="notice" role="status" aria-live="polite"></p><section id="progress" hidden><strong id="stage"></strong><pre id="logs"></pre></section>
<div class="tools"><div class="tabs"><button id="resources" aria-pressed="true">자료 목록</button><button id="news" aria-pressed="false">뉴스 한 건 공유</button></div><label class="search">찾기 <input id="search" type="search" placeholder="제목·설명"></label></div>
<div id="list"></div><p class="foot">포털에서 내려도 이미 공유한 주소는 유지됩니다. 원본 파일은 그대로 둡니다.</p></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="editor-title">자료 추가</h2><button type="button" id="close" aria-label="닫기">×</button></div><label>제목<input id="title" required maxlength="240"></label><label>설명<textarea id="description" rows="2" maxlength="2000"></textarea></label><label>기지 구역<select id="section"><option value="personal">개인</option><option value="code">C.O.D.E</option><option value="lecture">특강</option><option value="showcase">쇼케이스</option><option value="playground">AI 놀이터</option><option value="library">서고</option><option value="today">오늘</option><option value="archive">보관함</option></select></label><label>자료 주소<input id="href" type="text" placeholder="https://…"></label><div id="import-tools"><p>주소를 붙여넣거나 파일을 고르세요. HTML 자료는 이미지·스타일 파일도 함께 등록합니다.</p><div class="actions"><label class="file-button">파일 선택<input id="files" type="file" multiple></label><label class="file-button">폴더 선택<input id="folder" type="file" webkitdirectory multiple></label></div><p id="file-count">한 번에 40MB까지</p><label id="entry-wrap" hidden>처음 열 파일<select id="entry"></select></label></div><label class="switch"><input id="portal" type="checkbox">포털에도 표시</label><div class="dialog-foot"><span id="form-error" role="alert"></span><button type="submit" class="primary">저장</button></div></form></dialog>
<dialog id="copy-dialog"><h2>공유 주소</h2><p id="copy-description"></p><textarea id="copy-text" rows="4" readonly></textarea><button id="copy-close">닫기</button></dialog>
<script type="module" src="./ui.js"></script></body></html>
